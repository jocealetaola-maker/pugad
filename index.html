/* ================= storage ================= */
const Store = {
  async write(scope, id, body) {
    const row = { workspace_id: W, id, scope, owner_id: scope === 'private' ? S.uid : (body.createdBy || S.uid), body, updated_by: S.uid, updated_at: new Date().toISOString() };
    const { error } = await SB.from('pages').upsert(row, { onConflict: 'workspace_id,id' });
    if (error) throw error;
  },
  async remove(scope, id) {
    const { error } = await SB.from('pages').delete().eq('workspace_id', W).eq('id', id).eq('scope', scope);
    if (error) throw error;
  },
};

const saveTimers = new Map(), inflight = new Set(), again = new Set();
const keyOf = (scope, id) => scope + ':' + id;
const pendingLocal = k => saveTimers.has(k) || inflight.has(k);
function markDirty(scope, id, delay = 650) {
  const p = S.pages[scope].get(id); if (!p) return;
  p.updatedAt = Date.now(); if (S.uid) p.updatedBy = S.uid;
  histChange(scope, id);
  const k = keyOf(scope, id);
  clearTimeout(saveTimers.get(k));
  saveTimers.set(k, setTimeout(() => { saveTimers.delete(k); flush(scope, id); }, delay));
  setStatus('saving');
}
async function flush(scope, id) {
  const k = keyOf(scope, id);
  if (inflight.has(k)) { again.add(k); return; }
  const p = S.pages[scope].get(id); if (!p) return;
  inflight.add(k); let ok = true;
  try { await Store.write(scope, id, clone(p)); }
  catch (e) { ok = false; writeFailed(e); }
  finally {
    inflight.delete(k);
    if (again.delete(k)) flush(scope, id);
    else if (ok && !saveTimers.size && !inflight.size) setStatus('saved');
  }
}
function flushNow(scope, id) { const k = keyOf(scope, id); clearTimeout(saveTimers.get(k)); saveTimers.delete(k); return flush(scope, id); }
function writeFailed(e) {
  console.warn('save failed', e);
  setStatus('err');
  toast(S.ro ? 'You have view-only access, so changes are not saved.' : 'That change did not save. Check your connection and try again.');
}
function setStatus(s) {
  const el = $('#status'); el.dataset.s = s; el.className = 'status' + (s === 'err' ? ' err' : '');
  el.textContent = s === 'saving' ? 'Saving…' : s === 'saved' ? 'Saved' : s === 'err' ? 'Not saved' : '';
}

function applySettings(st) {
  const s = { ...DEFAULT_SETTINGS, ...obj(st) };
  s.h = num(s.h, 342) % 360; s.s = Math.max(0, Math.min(95, num(s.s, 72)));
  if (!FONTS[s.body]) s.body = 'nunito'; if (!FONTS[s.disp]) s.disp = 'fredoka';
  if (!RADII[s.radius]) s.radius = 'bubbly';
  if (!['none', 'dots', 'grid', 'gingham'].includes(s.pattern)) s.pattern = 'none';
  S.settings = s;
  const r = document.documentElement.style;
  r.setProperty('--h', s.h); r.setProperty('--s', s.s);
  r.setProperty('--font-body', FONTS[s.body].f); r.setProperty('--font-display', FONTS[s.disp].f);
  r.setProperty('--r', RADII[s.radius] + 'px');
  $('#main').dataset.pattern = s.pattern;
  document.body.classList.toggle('calm', !s.motion);
}

/* ================= pages ================= */
function scopeOf(id) { return S.pages.shared.has(id) ? 'shared' : S.pages.private.has(id) ? 'private' : null; }
function findPage(id) { const sc = scopeOf(id); return sc ? { scope: sc, page: S.pages[sc].get(id) } : null; }
function cur() { return S.current ? S.pages[S.current.scope].get(S.current.id) : null; }
function curDirty(delay) { if (S.current) markDirty(S.current.scope, S.current.id, delay); }
function normPage(p) {
  p = obj(p);
  p.title = str(p.title); p.icon = str(p.icon).slice(0, 16);
  p.cover = COVERS[p.cover] || isCoverUrl(p.cover) ? p.cover : null;
  p.blocks = arr(p.blocks).filter(b => b && typeof b === 'object').map(b => { b.id = str(b.id) || uid('b'); b.type = str(b.type) || 'text'; return b; });
  p.stickers = arr(p.stickers).filter(x => x && typeof x === 'object');
  p.style = obj(p.style);
  return p;
}
function childrenOf(scope, parentId) {
  return [...S.pages[scope].entries()].filter(([, p]) => (p.parent || null) === parentId)
    .sort((a, b) => num(a[1].order) - num(b[1].order) || num(a[1].createdAt) - num(b[1].createdAt));
}
function descendants(scope, id) {
  const out = []; const walk = pid => { for (const [cid] of childrenOf(scope, pid)) { out.push(cid); walk(cid); } }; walk(id); return out;
}
function ancestors(scope, id) {
  const out = []; let p = S.pages[scope].get(id); const seen = new Set();
  while (p && p.parent && !seen.has(p.parent)) { seen.add(p.parent); const pp = S.pages[scope].get(p.parent); if (!pp) break; out.unshift([p.parent, pp]); p = pp; }
  return out;
}
function blank() { return { id: uid('b'), type: 'text', text: '' }; }
function newPageObj(parent, tpl) {
  const base = { title: '', icon: '', cover: null, blocks: [blank()], stickers: [], style: {}, parent: parent || null, order: Date.now(), createdAt: Date.now(), createdBy: S.uid || null, updatedAt: Date.now(), updatedBy: S.uid || null };
  if (tpl) Object.assign(base, tpl());
  return base;
}
async function newPage(scope, parent = null, tplId = null) {
  if (S.mode === 'pending') return;
  if (scope === 'private' && S.mode === 'db' && !S.uid) { toast('Sign in to make private pages.'); return; }
  const id = uid('pg');
  const tpl = TEMPLATES.find(t => t.id === tplId);
  const page = newPageObj(parent, tpl && tpl.make);
  S.pages[scope].set(id, page);
  if (parent) {
    const pp = S.pages[scope].get(parent);
    if (pp) { pp.blocks.push({ id: uid('b'), type: 'subpage', data: { pageId: id } }); markDirty(scope, parent, 200); S.exp.add(keyOf(scope, parent)); saveExp(); }
  }
  flushNow(scope, id);
  openPage(scope, id);
  requestAnimationFrame(() => { const t = $('.title'); if (t && !page.title) t.focus(); });
}
function duplicatePage(scope, id) {
  const p = S.pages[scope].get(id); if (!p) return;
  const c = clone(p); const nid = uid('pg');
  c.title = (p.title || 'Untitled') + ' (copy)'; c.order = num(p.order) + 1; c.createdAt = Date.now(); c.createdBy = S.uid || null;
  c.blocks = c.blocks.filter(b => b.type !== 'subpage').map(b => ({ ...b, id: uid('b') }));
  S.pages[scope].set(nid, c); flushNow(scope, nid); openPage(scope, nid); toast('Page duplicated');
}
function deletePage(scope, id) {
  const p = S.pages[scope].get(id); if (!p) return;
  const ids = [id, ...descendants(scope, id)];
  const n = ids.length - 1;
  confirmModal(`Delete “${p.title || 'Untitled'}”?`, n ? `This also deletes ${n} page${n > 1 ? 's' : ''} inside it. This can't be undone.` : `This can't be undone.`, 'Delete', async () => {
    if (p.parent) { const pp = S.pages[scope].get(p.parent); if (pp) { unlinkSub(pp, id); markDirty(scope, p.parent, 100); } }
    for (const x of ids) { const k = keyOf(scope, x); clearTimeout(saveTimers.get(k)); saveTimers.delete(k); S.pages[scope].delete(x); Store.remove(scope, x).catch(writeFailed); }
    if (S.current && ids.includes(S.current.id)) { S.current = null; history.replaceState(null, '', location.pathname + location.search); routeDefault(); }
    renderSidebar(); renderPage(); toast('Page deleted');
  });
}
async function movePage(scope, id) {
  const to = scope === 'shared' ? 'private' : 'shared';
  if (to === 'private' && S.mode === 'db' && !S.uid) return;
  const ids = [id, ...descendants(scope, id)];
  const p = S.pages[scope].get(id);
  if (p && p.parent) { const pp = S.pages[scope].get(p.parent); if (pp) { unlinkSub(pp, id); markDirty(scope, p.parent, 100); } }
  for (const x of ids) {
    const body = clone(S.pages[scope].get(x)); if (x === id) body.parent = null;
    S.pages[to].set(x, body); S.pages[scope].delete(x);
    try { await Store.write(to, x, body); await Store.remove(scope, x); } catch (e) { writeFailed(e); }
  }
  if (S.current && ids.includes(S.current.id)) S.current.scope = to;
  setHash(); renderSidebar(); renderPage();
  toast(to === 'shared' ? 'Moved to Shared. Everyone with access can see it now.' : 'Moved to Private. Only you can see it now.');
}

function subscribeLive() {
  SB.channel('ws-' + W)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pages', filter: 'workspace_id=eq.' + W }, pl => {
      if (pl.eventType === 'DELETE') {
        const id = pl.old && pl.old.id; if (!id) return;
        for (const sc of ['shared', 'private']) if (S.pages[sc].has(id)) onRemote(sc, { docChanges: () => [{ type: 'removed', doc: { id } }] });
        return;
      }
      const r = pl.new; if (!r || !r.id || !r.body) return;
      const sc = r.scope === 'private' ? 'private' : 'shared', other = sc === 'shared' ? 'private' : 'shared';
      if (S.pages[other].has(r.id) && !pendingLocal(keyOf(other, r.id))) onRemote(other, { docChanges: () => [{ type: 'removed', doc: { id: r.id } }] });
      onRemote(sc, { docChanges: () => [{ type: S.pages[sc].has(r.id) ? 'modified' : 'added', doc: rowDoc(r) }] });
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'workspaces', filter: 'id=eq.' + W }, pl => applyWsRow(pl.new))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pets', filter: 'workspace_id=eq.' + W }, pl => { if (pl.new && pl.new.workspace_id) applyPet(pl.new); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'billing_accounts', filter: 'account_id=eq.' + W }, pl => {
      const r = pl.new; if (!r || r.product !== 'workspace') return;
      const was = isPaid(); AI.paidUntil = r.paid_until; AI.interval = r.plan_interval; updateAiBadge();
      if (!was && isPaid()) toast('Your plan is active. Enjoy! 🎉');
    })
    .subscribe();
}

/* ================= Chat spaces (Slack-like) ================= */
let CHAT = { open: false, channel: null, channels: [], messages: [] };

async function openChat() {
  CHAT.open = true;
  await loadChannels();
  renderChatModal();
}

async function loadChannels() {
  const { data, error } = await SB.from('channels').select('id, name, description, is_private, created_by').eq('workspace_id', W).order('name');
  if (error) { toast("Couldn't load channels: " + error.message); CHAT.channels = []; return; }
  CHAT.channels = data || [];
  if (!CHAT.channel && CHAT.channels.length) CHAT.channel = CHAT.channels[0].id;
}

async function loadMessages(channelId) {
  if (!channelId) { CHAT.messages = []; return; }
  const { data, error } = await SB.from('messages').select('id, user_id, content, created_at').eq('channel_id', channelId).order('created_at', { ascending: true }).limit(200);
  if (error) { toast("Couldn't load messages: " + error.message); CHAT.messages = []; return; }
  CHAT.messages = data || [];
}

function renderChatModal() {
  const body = h('div', { class: 'chat-layout', style: 'display:grid;grid-template-columns:220px 1fr;height:70vh;gap:12px;min-width:640px' });
  const side = h('div', { class: 'chat-side', style: 'border-right:1px solid var(--line);overflow-y:auto;padding-right:8px' });
  const main = h('div', { class: 'chat-main', style: 'display:flex;flex-direction:column;min-width:0' });

  // Channel list
  side.append(h('div', { class: 'side-label', style: 'margin-bottom:6px' }, 'Channels', h('button', { class: 'side-label', onclick: createChannelPrompt, title: 'New channel' }, '+')));
  if (!CHAT.channels.length) side.append(h('div', { class: 'side-empty', text: 'No channels yet' }));
  for (const ch of CHAT.channels) {
    const row = h('button', { class: 'tr' + (ch.id === CHAT.channel ? ' cur' : ''), style: 'width:100%;text-align:left', onclick: () => selectChannel(ch.id) },
      h('span', { class: 'tr-ico', text: ch.is_private ? '🔒' : '#' }),
      h('span', { class: 'tr-name', text: ch.name }));
    side.append(row);
  }

  // Messages area
  const msgs = h('div', { id: 'chatMsgs', style: 'flex:1;overflow-y:auto;padding:8px 4px;display:flex;flex-direction:column;gap:8px' });
  const inputRow = h('div', { style: 'display:flex;gap:8px;margin-top:8px' });
  const inp = h('input', { class: 'field', placeholder: 'Message…', style: 'flex:1', id: 'chatInput' });
  const send = h('button', { class: 'btn', onclick: sendMessage }, 'Send');
  inputRow.append(inp, send);
  main.append(msgs, inputRow);

  body.append(side, main);
  openModal('Chat spaces', body, true);

  if (CHAT.channel) selectChannel(CHAT.channel);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
}

async function selectChannel(id) {
  CHAT.channel = id;
  await loadMessages(id);
  renderMessages();
  // re-highlight
  const modal = $('#modal'); if (modal) {
    modal.querySelectorAll('.tr').forEach(el => el.classList.remove('cur'));
    const rows = modal.querySelectorAll('.tr');
    // crude re-render of side is simpler; for now just update messages
  }
}

function renderMessages() {
  const box = $('#chatMsgs'); if (!box) return;
  box.replaceChildren();
  if (!CHAT.messages.length) {
    box.append(h('div', { class: 'w-sub', style: 'text-align:center;margin-top:40px', text: 'No messages yet. Say hello.' }));
    return;
  }
  for (const m of CHAT.messages) {
    const name = S.names.get(m.user_id) || (m.user_id === S.uid ? (S.meName || 'You') : 'Teammate');
    const time = new Date(m.created_at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    box.append(h('div', { style: 'display:flex;gap:8px;align-items:flex-start' },
      h('span', { class: 'avatar', style: 'width:28px;height:28px;font-size:13px;flex:none', text: name.slice(0,1).toUpperCase() }),
      h('div', { style: 'min-width:0' },
        h('div', { style: 'display:flex;gap:6px;align-items:baseline' },
          h('b', { text: name }),

        h('div', { text: m.content, style: 'white-space:pre-wrap;word-break:break-word' }))));
  }
  box.scrollTop = box.scrollHeight;
}

async function sendMessage() {
  const inp = $('#chatInput'); if (!inp || !CHAT.channel) return;
  const text = inp.value.trim(); if (!text) return;
  inp.value = '';
  const { error } = await SB.from('messages').insert({ channel_id: CHAT.channel, user_id: S.uid, content: text });
  if (error) { toast("Couldn't send: " + error.message); return; }
  await loadMessages(CHAT.channel);
  renderMessages();
}

async function createChannelPrompt() {
  const name = prompt('Channel name (e.g. clients, delegates, general)');
  if (!name || !name.trim()) return;
  const clean = name.trim().toLowerCase().replace(/[^a-z0-9-_]/g, '-').replace(/-+/g, '-').slice(0, 40);
  const { error } = await SB.from('channels').insert({ workspace_id: W, name: clean, created_by: S.uid });
  if (error) { toast("Couldn't create channel: " + error.message); return; }
  await loadChannels();
  renderChatModal();
}

  try { applySettings(JSON.parse(lsGet('buhat.settings') || 'null') || DEFAULT_SETTINGS); } catch (e) { applySettings(DEFAULT_SETTINGS); }

    authScreen(h('div', { class: 'auth-body' }, h('h2', { text: 'Almost there' }), h('p', { text: 'Open index.html and add your Supabase project URL and anon key to CONFIG near the top of the script, then reload this page.' })));
    return;
  }
  SB = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const hashErr = new URLSearchParams(location.hash.slice(1));
  if (hashErr.get('error')) history.replaceState(null, '', location.pathname);
  const { data: sd } = await SB.auth.getSession();
  let session = sd && sd.session;
  if (session) {
    // Make sure the server still accepts this sign-in before using it.
    const { data: who, error: whoErr } = await SB.auth.getUser();
    if (whoErr || !who || !who.user) { await SB.auth.signOut().catch(() => {}); session = null; }
  }
  if (!session) {
    loginScreen(hashErr.get('error_code') === 'otp_expired' ? 'That sign-in link expired or was already used. Send yourself a new code.' : '');
    SB.auth.onAuthStateChange((ev, s) => { if (s && ev === 'SIGNED_IN') location.reload(); });
    return;
  }
  SB.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') location.reload(); });
  const u = session.user; S.uid = u.id; S.email = u.email || '';
  await SB.rpc('accept_invites');
  const { data: mems, error } = await SB.from('members').select('workspace_id, role, workspaces(name, icon)').eq('user_id', u.id);
  if (error) { authScreen(h('div', { class: 'auth-body' }, h('h2', { text: "We couldn't load your workspaces" }), h('p', { text: error.message }), h('button', { class: 'btn', onclick: () => location.reload() }, 'Try again'))); return; }
  if (!mems || !mems.length) { onboardScreen(); return; }
  S.wsList = mems.map(m => ({ id: m.workspace_id, role: m.role, name: (m.workspaces && m.workspaces.name) || 'Workspace', icon: (m.workspaces && m.workspaces.icon) || '🐣' }));
  const pick = S.wsList.find(w => w.id === lsGet('buhat.ws')) || S.wsList[0];
  W = pick.id; S.role = pick.role; lsSet('buhat.ws', W);
  S.meta = { name: pick.name, icon: pick.icon };
  const { data: prof } = await SB.from('profiles').select('display_name, email').eq('id', u.id).maybeSingle();
  S.meName = (prof && prof.display_name) || S.email.split('@')[0];
  S.user = { profiles: async ids => { const { data } = await SB.from('profiles').select('id, display_name, email').in('id', ids); const out = {}; for (const r of data || []) out[r.id] = { name: r.display_name || r.email || '' }; return out; } };
  closeAuth(); bindGlobal(); bindBuhat(); renderSidebar(); renderPage();
  const { data: st } = await SB.from('user_settings').select('settings').eq('user_id', u.id).maybeSingle();
  if (st && st.settings && Object.keys(st.settings).length) { applySettings(st.settings); lsSet('buhat.settings', JSON.stringify(S.settings)); }
  await loadWorkspaceMeta();
  await loadPages();

/* undo / redo: every change to a page is remembered (typing is grouped into short bursts) */
const HIST = new Map(); // 'scope:id' → { base, undo: [], redo: [], open, t }

  updateUndoBtns();
}
function histClose(scope, id) { const H = histOf(scope, id); clearTimeout(H.t); if (H.open) { H.open = false; } const p = S.pages[scope] && S.pages[scope].get(id); if (p) H.base = pageSnap(p); }

}
function applySnap(scope, id, snapStr) {
  const p = S.pages[scope] && S.pages[scope].get(id); if (!p) return false;
  const next = JSON.parse(snapStr);
  const keep = new Set(allBlocks(next).map(b => b.id));
  for (const x of allBlocks(p)) if (!keep.has(x.id)) stopTimer(x.id);
  for (const k of Object.keys(p)) if (k !== 'updatedAt' && k !== 'updatedBy') delete p[k];

}

  if (!H.undo.length) { toast('Nothing to undo'); updateUndoBtns(); return false; }
  H.redo.push(pageSnap(p));
  applySnap(scope, id, H.undo.pop());

}
function redo() {
  if (!S.current) return false;
  const { scope, id } = S.current; const p = cur(); if (!p) return false;
  histClose(scope, id);
  const H = histOf(scope, id);
  if (!H.redo.length) { toast('Nothing to redo'); updateUndoBtns(); return false; }

}
function updateUndoBtns() {

function blocksToText(list, depth = 0) {

      case 'h3': out.push(ind + '### ' + t); break;
      case 'bullet': out.push(ind + '- ' + t); break;
      case 'numbered': out.push(ind + n + '. ' + t); break;
      case 'todo': out.push(ind + `- [${b.checked ? 'x' : ' '}] ` + t); break;
      case 'quote': out.push(ind + '> ' + t); break;

      case 'toggle': out.push(ind + '▸ ' + t); if (plain(b.body).trim()) out.push(ind + '  ' + plain(b.body)); break;

/* drag a box from the page margin to select blocks */
let RB = null;
function startRubber(e) {
  const main = $('#main'); const m0 = main.scrollTop;
  RB = { x0: e.clientX, y0: e.clientY + m0, el: null, add: e.shiftKey ? new Set(SELB) : null, moved: false, auto: 0, px: e.clientX, py: e.clientY };
  const move = ev => {
    RB.px = ev.clientX; RB.py = ev.clientY;
    if (!RB.moved && Math.hypot(ev.clientX - RB.x0, ev.clientY + main.scrollTop - RB.y0) < 6) return;
    if (!RB.moved) { RB.moved = true; RB.el = h('div', { class: 'rubber' }); document.body.append(RB.el); document.body.classList.add('rubbering'); getSelection().removeAllRanges(); if (isEditable(document.activeElement)) document.activeElement.blur(); }
    drawRubber();
  };
  const tick = () => {
    if (!RB) return;
    const mr = main.getBoundingClientRect(); let dy = 0;
    if (RB.py < mr.top + 40) dy = -Math.ceil((mr.top + 40 - RB.py) / 3); else if (RB.py > mr.bottom - 40) dy = Math.ceil((RB.py - mr.bottom + 40) / 3);
    if (RB.moved && dy) { main.scrollTop += dy; drawRubber(); }
    RB.auto = requestAnimationFrame(tick);
  };
  const up = () => {
    removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
    if (RB) { cancelAnimationFrame(RB.auto); RB.el?.remove(); if (!RB.moved && !e.shiftKey) clearSel(); }
    document.body.classList.remove('rubbering'); RB = null;
  };
  addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  RB.auto = requestAnimationFrame(tick);
}
function drawRubber() {
  const main = $('#main'); const yNow = RB.py + main.scrollTop;
  const top = Math.min(RB.y0, yNow) - main.scrollTop, bottom = Math.max(RB.y0, yNow) - main.scrollTop;
  const left = Math.min(RB.x0, RB.px), right = Math.max(RB.x0, RB.px);
  Object.assign(RB.el.style, { left: left + 'px', top: top + 'px', width: right - left + 'px', height: bottom - top + 'px' });
  const hits = [];
  for (const el of visibleBlockEls()) { const r = el.getBoundingClientRect(); if (r.bottom > top && r.top < bottom && r.right > left && r.left < right) hits.push({ el, r, id: el.dataset.id }); }

  const ids = new Set(hits.map(x => x.id));
  for (const x of hits) { const inner = hits.some(y => y !== x && x.el.contains(y.el)); if (inner && top > x.r.top + 8) ids.delete(x.id); }

  SELB.clear(); for (const id of all) SELB.add(id); selAnchor = keep[0] || null; selFocus = keep[keep.length - 1] || null;

}

function bindSelection() {
  // Start a selection box by dragging on the page (margins, gutters, or non-editing areas).
  // Tip: click and drag in the empty space left of the blocks, or hold Shift and drag.
  $('#main').addEventListener('pointerdown', e => {
    if (e.button !== 0 || e.pointerType === 'touch' || !cur()) return;
    const t = e.target;
    const inPage = t.closest('#page');
    if (!inPage) {
      if (SELB.size && !t.closest('.sel-bar')) clearSel();
      return;
    }
    // Don't start selection if the user is clicking an editable or a real control
    const editable = t.closest('[contenteditable="true"]');
    const control = t.closest('button, a, input, select, textarea, .cover, .title, .page-tools, .tpl-row, .stk, .icon-wrap, .meta-line, .col-add, .fmt, .pop, .bh-drag');

    const mod = e.metaKey || e.ctrlKey; const k = e.key.toLowerCase();
    if (mod && (k === 'z' || k === 'y') && cur() && !$('#modal') && !$('#auth')) {
      // Pugad's own undo covers typing and block changes alike. Plain input boxes keep the browser's own undo.
      const ae = document.activeElement;
      if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
      if (ae && ae.isContentEditable && !pageEl.contains(ae)) return;
      e.preventDefault(); e.stopPropagation();
      const edc = ae && ae.isContentEditable ? edCtx(ae) : null;
      const back = edc ? { id: edc.b.id, field: edc.field, off: caretOffset(edc.ed) } : ae && ae.classList && ae.classList.contains('title') ? { title: true } : null;

      return;
    }

}

  const when = t => new Date(t).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  const show = (r, btn) => {
    $$('.hist-item', list).forEach(x => x.setAttribute('aria-selected', String(x === btn)));

}
function restoreVersion(scope, id, r) {

  const segm = (key, opts) => h('div', { class: 'seg' }, opts.map(([v, l]) => h('button', { class: st[key] === v ? 'on' : '', onclick: () => set({ [key]: v }) }, l)));
  const nameIn = h('input', { class: 'field', value: S.meta.name || '', maxlength: '40', 'aria-label': 'Workspace name', id: 'wsNameInput' });
  nameIn.addEventListener('input', () => { S.meta.name = nameIn.value.trim() || 'Workspace'; renderSidebar(); saveMeta(); });
  const motion = h('input', { type: 'checkbox', checked: st.motion ? true : null, id: 'motionToggle' }); motion.addEventListener('change', () => set({ motion: motion.checked }));
  const dragonT = h('input', { type: 'checkbox', checked: st.dragon !== false ? true : null, id: 'dragonToggle' }); dragonT.addEventListener('change', () => { set({ dragon: dragonT.checked }); mountBuddy(); });
  openModal('Make it yours', h('div', { style: 'display:grid;gap:18px' },

        h('b', { text: pr.n, style: `font-family:${FONTS[pr.disp].f}` }), h('small', { class: 'w-sub', text: FONTS[pr.body].n }))))),
    h('div', { class: 'frow' }, h('div', { class: 'msec', style: 'gap:4px' }, h('span', { class: 'w-sub', text: 'Custom accent' }), colorIn), fontSel('disp', 'Headings font'), fontSel('body', 'Text font')),
    h('div', { class: 'msec' }, h('span', { class: 'lbl', text: 'Corners' }), segm('radius', [['crisp', 'Crisp'], ['soft', 'Soft'], ['bubbly', 'Bubbly']])),
    h('div', { class: 'msec' }, h('span', { class: 'lbl', text: 'Background' }), segm('pattern', [['none', 'Plain'], ['dots', 'Polka dots'], ['grid', 'Grid paper'], ['gingham', 'Gingham']])),
    h('label', { class: 'switch' }, motion, 'Playful animations'),

    h('div', { class: 'msep' }),
    h('div', { class: 'msec' }, h('span', { class: 'lbl', text: S.mode === 'db' ? 'Workspace (everyone sees this)' : 'Workspace' }),
      h('div', { class: 'frow' }, h('button', { class: 'ws-ico', style: 'width:40px;height:40px', 'aria-label': 'Workspace icon', onclick: e => emojiPop(e.currentTarget, em => { S.meta.icon = em; renderSidebar(); saveMeta(); customize(); }) }, S.meta.icon || '🐣'), nameIn)),
    h('p', { class: 'w-sub', style: 'margin:0', text: 'Theme, fonts and background are your own view. Covers, icons, stickers and page style are saved on each page for everyone.' })), true);
}
function hslHex(hh, s, l) { s /= 100; l /= 100; const k = n => (n + hh / 30) % 12; const a = s * Math.min(l, 1 - l); const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); return '#' + [f(0), f(8), f(4)].map(x => Math.round(x * 255).toString(16).padStart(2, '0')).join(''); }
function hexHs(hx) { const r = parseInt(hx.slice(1, 3), 16) / 255, g = parseInt(hx.slice(3, 5), 16) / 255, b = parseInt(hx.slice(5, 7), 16) / 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn; let hh = 0; if (d) { if (mx === r) hh = ((g - b) / d) % 6; else if (mx === g) hh = (b - r) / d + 2; else hh = (r - g) / d + 4; hh *= 60; if (hh < 0) hh += 360; } const l = (mx + mn) / 2; const s = d ? d / (1 - Math.abs(2 * l - 1)) : 0; return [hh, s * 100]; }

/* ================= search ================= */
function searchModal() {
  const inp = h('input', { class: 'field', placeholder: 'Search page titles and text', 'aria-label': 'Search', id: 'searchInput', style: 'font-size:16px;padding:10px 14px' });
  const res = h('div', { class: 'search-res' });
  const draw = () => {
    const q = inp.value.toLowerCase().trim(); res.replaceChildren();
    const all = [];
    for (const scope of ['shared', 'private']) for (const [id, p] of S.pages[scope]) {
      const body = allBlocks(p).map(b => plain(b.text) + ' ' + plain(b.body)).join(' ');
      const hitT = (p.title || '').toLowerCase().includes(q); const hitB = q && body.toLowerCase().includes(q);
      if (!q || hitT || hitB) all.push({ scope, id, p, snip: hitB && !hitT ? body.substr(Math.max(0, body.toLowerCase().indexOf(q) - 30), 90) : '' });
    }
    all.sort((a, b) => num(b.p.updatedAt) - num(a.p.updatedAt));
    if (!all.length) res.append(h('div', { class: 'mempty', text: 'No pages match that.' }));
    for (const r of all.slice(0, 40)) res.append(h('button', { class: 'mi', onclick: () => { closeModal(); openPage(r.scope, r.id); } }, h('span', { class: 'mic', text: r.p.icon || '📄' }), h('span', { class: 'mt' }, h('b', { text: r.p.title || 'Untitled' }), h('small', { text: (r.scope === 'shared' ? 'Shared' : 'Private') + (r.snip ? ' · …' + r.snip + '…' : ' · edited ' + timeAgo(r.p.updatedAt)) }))));
  };
  inp.addEventListener('input', draw);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { res.querySelector('.mi')?.click(); } });
  openModal('Search', h('div', { style: 'display:grid;gap:10px' }, inp, res));
  draw(); setTimeout(() => inp.focus(), 10);
}
function newPageModal(scope) {
  openModal('New page', h('div', { class: 'msec' },
    S.mode === 'db' ? h('div', { class: 'seg', id: 'scopeSeg' }, ['shared', 'private'].map(sc => h('button', { class: sc === scope ? 'on' : '', onclick: () => newPageModal(sc) }, sc === 'shared' ? '👥 Shared with team' : '🔒 Private'))) : '',
    h('div', { class: 'tpl-cards' }, TEMPLATES.map(t => h('button', { class: 'tpl-card', onclick: () => { closeModal(); newPage(scope, null, t.id === 'blank' ? null : t.id); } }, h('span', { class: 'ti', text: t.i }), h('b', { text: t.n }), h('small', { text: t.d }))))), true);
}

/* ================= empty state ================= */

}

/* ================= remote sync ================= */
function onRemote(scope, snap) {
  let curChanged = false;
  for (const ch of snap.docChanges()) {
    const id = ch.doc.id;
    if (scope === 'private' && !id.startsWith('pg')) {
      if (id === 'settings' && ch.type !== 'removed') { const data = ch.doc.data(); if (JSON.stringify(data) !== JSON.stringify(S.settings)) { applySettings(data); lsSet('buhat.settings', JSON.stringify(S.settings)); } }
      continue;
    }
    const k = keyOf(scope, id);
    if (pendingLocal(k)) continue;
    if (ch.type === 'removed') { S.pages[scope].delete(id); if (S.current && S.current.id === id) { S.current = null; curChanged = 'gone'; } continue; }
    const data = normPage(clone(ch.doc.data() || {}));
    const old = S.pages[scope].get(id);
    if (old && JSON.stringify(old) === JSON.stringify(data)) continue;
    // A late echo of one of our own older saves must never replace newer local changes.
    if (old && S.uid && data.updatedBy === S.uid && num(data.updatedAt) < num(old.updatedAt)) continue;
    if (old && num(old.updatedAt) > num(data.updatedAt) && Date.now() - num(old.updatedAt) < 15000 && old.updatedBy === S.uid) continue;
    S.pages[scope].set(id, data);
    histBaseline(scope, id);
    if (S.current && S.current.scope === scope && S.current.id === id) curChanged = true;
  }
  S.loaded[scope] = true;
  if (S.mode === 'pending' && S.loaded.shared && (S.loaded.private || !S.uid)) { S.mode = 'db'; renderSidebar(); routeDefault(); if (!S.current) renderPage(); return; }
  if (S.mode !== 'db') return;
  renderSidebar();
  if (curChanged === 'gone') { toast('That page was deleted by someone else.'); routeDefault(); renderPage(); }
  else if (curChanged) {
    const a = document.activeElement;
    if (a && pageEl.contains(a) && (a.isContentEditable || a.tagName === 'INPUT' || a.tagName === 'SELECT') || POP || $('#modal') || S.stickerMode) S.remotePending = true;
    else { const sc = $('#main').scrollTop; renderPage(); $('#main').scrollTop = sc; }
  } else renderTopbar();
}

  $('#collapseBtn').onclick = () => { $('#app').classList.add('collapsed'); $('#expandBtn').hidden = false; lsSet('buhat.col', '1'); };
  $('#expandBtn').onclick = () => { $('#app').classList.remove('collapsed'); $('#expandBtn').hidden = true; lsSet('buhat.col', ''); };
  if (lsGet('buhat.col') === '1' && innerWidth > 760) { $('#app').classList.add('collapsed'); $('#expandBtn').hidden = false; }
  $('#menuBtn').onclick = openDrawer;
  bindSelection();
  $('#main').addEventListener('scroll', () => { if (POP && !SL) closePop(); closeFmt(); }, { passive: true });
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); searchModal(); }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'j') { e.preventDefault(); toggleAgent(); }
    if (e.key === 'Escape') { if (POP) closePop(); else if ($('#modal')) closeModal(); else if (S.stickerMode) toggleStickers(); else closeDrawer(); }
  });
  window.addEventListener('resize', () => { if (POP && !SL) closePop(); });
  window.addEventListener('beforeunload', () => { for (const k of [...saveTimers.keys()]) { const [sc, id] = k.split(':'); flushNow(sc, id); } });
  setInterval(() => { if (S.current) renderMeta(); }, 60000);
}

boot();
