<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light; }
html, body { margin: 0; } body { -webkit-font-smoothing: antialiased; } img { max-width: 100%; } [hidden] { display: none !important; }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..700&family=Caveat:wght@500;700&family=Comfortaa:wght@400..700&family=Figtree:wght@400..700&family=Fraunces:opsz,wght@9..144,400..700&family=Fredoka:wght@400..700&family=Gaegu:wght@400;700&family=Nunito:wght@400..800&family=Patrick+Hand&family=Quicksand:wght@400..700&display=swap">
<style>
/* Layout: Notion-style two-pane app. Soft tinted sidebar + open page canvas; every color derives from one accent hue (--h/--s) so themes recolor the whole room. */
:root, .themed {
  --h: 342; --s: 72;
  --bg: hsl(var(--h) calc(var(--s) * .40%) 98.8%);
  --side: hsl(var(--h) calc(var(--s) * .55%) 96%);
  --card: hsl(var(--h) calc(var(--s) * .50%) 99.7%);
  --fg: hsl(var(--h) 22% 17%);
  --muted: hsl(var(--h) 10% 45%);
  --faint: hsl(var(--h) 12% 62%);
  --line: hsl(var(--h) calc(var(--s) * .35%) 89%);
  --hover: hsl(var(--h) calc(var(--s) * .60%) 93.5%);
  --accent: hsl(var(--h) calc(var(--s) * 1%) 72%);
  --accent-strong: hsl(var(--h) calc(var(--s) * .9%) 54%);
  --accent-soft: hsl(var(--h) calc(var(--s) * 1%) 94.5%);
  --accent-ink: hsl(var(--h) calc(var(--s) * .7%) 33%);
  --on-accent: hsl(var(--h) 40% 14%);
  --shadow: 0 1px 2px hsl(var(--h) 30% 30% / .06), 0 8px 24px hsl(var(--h) 40% 40% / .10);
  --shadow-sm: 0 1px 2px hsl(var(--h) 30% 30% / .05), 0 2px 8px hsl(var(--h) 40% 40% / .05);
  --cover-dim: 1;
  --danger: hsl(355 70% 50%);
  --c-pink: hsl(345 90% 94%);   --c-pink-ink: hsl(345 55% 38%);
  --c-peach: hsl(22 95% 92%);   --c-peach-ink: hsl(20 60% 36%);
  --c-butter: hsl(46 95% 88%);  --c-butter-ink: hsl(38 65% 30%);
  --c-mint: hsl(150 55% 90%);   --c-mint-ink: hsl(152 45% 28%);
  --c-sky: hsl(205 90% 92%);    --c-sky-ink: hsl(208 55% 35%);
  --c-lilac: hsl(265 80% 94%);  --c-lilac-ink: hsl(265 40% 42%);
  --c-gray: hsl(var(--h) 12% 93%); --c-gray-ink: hsl(var(--h) 10% 35%);
  --q-do: hsl(350 90% 95.5%);   --q-do-ink: hsl(350 55% 40%);   --q-do-line: hsl(350 70% 86%);
  --q-plan: hsl(205 90% 95%);   --q-plan-ink: hsl(208 55% 36%); --q-plan-line: hsl(205 60% 84%);
  --q-del: hsl(40 95% 92%);     --q-del-ink: hsl(34 65% 32%);   --q-del-line: hsl(40 70% 80%);
  --q-drop: hsl(150 18% 94%);   --q-drop-ink: hsl(150 15% 35%); --q-drop-line: hsl(150 15% 84%);
  --font-body: 'Nunito', system-ui, sans-serif;
  --font-display: 'Fredoka', 'Nunito', system-ui, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]), :root:not([data-theme="light"]) .themed {
    --bg: hsl(var(--h) calc(var(--s) * .18%) 10.5%);
    --side: hsl(var(--h) calc(var(--s) * .20%) 13%);
    --card: hsl(var(--h) calc(var(--s) * .18%) 15%);
    --fg: hsl(var(--h) 25% 91%);
    --muted: hsl(var(--h) 10% 66%);
    --faint: hsl(var(--h) 8% 48%);
    --line: hsl(var(--h) calc(var(--s) * .15%) 23%);
    --hover: hsl(var(--h) calc(var(--s) * .20%) 19%);
    --accent: hsl(var(--h) calc(var(--s) * .9%) 74%);
    --accent-strong: hsl(var(--h) calc(var(--s) * .85%) 68%);
    --accent-soft: hsl(var(--h) calc(var(--s) * .30%) 21%);
    --accent-ink: hsl(var(--h) calc(var(--s) * .9%) 82%);
    --on-accent: hsl(var(--h) 40% 13%);
    --shadow: 0 1px 2px hsl(0 0% 0% / .3), 0 10px 28px hsl(0 0% 0% / .35);
    --shadow-sm: 0 1px 2px hsl(0 0% 0% / .25);
    --cover-dim: .8;
    --danger: hsl(355 80% 68%);
    --c-pink: hsl(345 30% 22%);   --c-pink-ink: hsl(345 80% 84%);
    --c-peach: hsl(22 30% 21%);   --c-peach-ink: hsl(22 85% 80%);
    --c-butter: hsl(46 30% 20%);  --c-butter-ink: hsl(46 85% 76%);
    --c-mint: hsl(150 22% 19%);   --c-mint-ink: hsl(150 55% 76%);
    --c-sky: hsl(205 30% 21%);    --c-sky-ink: hsl(205 80% 82%);
    --c-lilac: hsl(265 25% 23%);  --c-lilac-ink: hsl(265 80% 86%);
    --c-gray: hsl(var(--h) 8% 20%); --c-gray-ink: hsl(var(--h) 10% 78%);
    --q-do: hsl(350 25% 17%);   --q-do-ink: hsl(350 80% 82%);   --q-do-line: hsl(350 25% 28%);
    --q-plan: hsl(205 25% 17%); --q-plan-ink: hsl(205 80% 82%); --q-plan-line: hsl(205 25% 28%);
    --q-del: hsl(40 25% 16%);   --q-del-ink: hsl(40 85% 76%);   --q-del-line: hsl(40 25% 27%);
    --q-drop: hsl(150 10% 16%); --q-drop-ink: hsl(150 20% 74%); --q-drop-line: hsl(150 10% 26%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"], :root[data-theme="dark"] .themed {
  --bg: hsl(var(--h) calc(var(--s) * .18%) 10.5%);
  --side: hsl(var(--h) calc(var(--s) * .20%) 13%);
  --card: hsl(var(--h) calc(var(--s) * .18%) 15%);
  --fg: hsl(var(--h) 25% 91%);
  --muted: hsl(var(--h) 10% 66%);
  --faint: hsl(var(--h) 8% 48%);
  --line: hsl(var(--h) calc(var(--s) * .15%) 23%);
  --hover: hsl(var(--h) calc(var(--s) * .20%) 19%);
  --accent: hsl(var(--h) calc(var(--s) * .9%) 74%);
  --accent-strong: hsl(var(--h) calc(var(--s) * .85%) 68%);
  --accent-soft: hsl(var(--h) calc(var(--s) * .30%) 21%);
  --accent-ink: hsl(var(--h) calc(var(--s) * .9%) 82%);
  --on-accent: hsl(var(--h) 40% 13%);
  --shadow: 0 1px 2px hsl(0 0% 0% / .3), 0 10px 28px hsl(0 0% 0% / .35);
  --shadow-sm: 0 1px 2px hsl(0 0% 0% / .25);
  --cover-dim: .8;
  --danger: hsl(355 80% 68%);
  --c-pink: hsl(345 30% 22%);   --c-pink-ink: hsl(345 80% 84%);
  --c-peach: hsl(22 30% 21%);   --c-peach-ink: hsl(22 85% 80%);
  --c-butter: hsl(46 30% 20%);  --c-butter-ink: hsl(46 85% 76%);
  --c-mint: hsl(150 22% 19%);   --c-mint-ink: hsl(150 55% 76%);
  --c-sky: hsl(205 30% 21%);    --c-sky-ink: hsl(205 80% 82%);
  --c-lilac: hsl(265 25% 23%);  --c-lilac-ink: hsl(265 80% 86%);
  --c-gray: hsl(var(--h) 8% 20%); --c-gray-ink: hsl(var(--h) 10% 78%);
  --q-do: hsl(350 25% 17%);   --q-do-ink: hsl(350 80% 82%);   --q-do-line: hsl(350 25% 28%);
  --q-plan: hsl(205 25% 17%); --q-plan-ink: hsl(205 80% 82%); --q-plan-line: hsl(205 25% 28%);
  --q-del: hsl(40 25% 16%);   --q-del-ink: hsl(40 85% 76%);   --q-del-line: hsl(40 25% 27%);
  --q-drop: hsl(150 10% 16%); --q-drop-ink: hsl(150 20% 74%); --q-drop-line: hsl(150 10% 26%);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15.5px; line-height: 1.55; overflow: hidden; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; border-radius: 6px; }
::selection { background: var(--accent); color: var(--on-accent); }

#app { display: grid; grid-template-columns: 264px minmax(0, 1fr); height: 100%; }
#app.collapsed { grid-template-columns: 0 minmax(0, 1fr); }
#app.collapsed #sidebar { visibility: hidden; }

/* ---------- Sidebar ---------- */
#sidebar { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.ws-head { display: flex; align-items: center; gap: 8px; padding: 14px 12px 8px 14px; }
.ws-ico { width: 34px; height: 34px; border-radius: calc(var(--r) * .7); background: var(--card); box-shadow: var(--shadow-sm); display: grid; place-items: center; font-size: 19px; flex: none; }
.ws-name { font-family: var(--font-display); font-weight: 600; font-size: 17px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; border-radius: 8px; padding: 2px 6px; }
.ws-name:hover { background: var(--hover); }
.side-actions { display: grid; gap: 2px; padding: 4px 8px 8px; }
.side-btn { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: calc(var(--r) * .6); color: var(--muted); font-weight: 600; font-size: 14px; text-align: left; }
.side-btn:hover { background: var(--hover); color: var(--fg); }
.side-btn kbd { margin-left: auto; font-family: var(--font-body); font-size: 11px; color: var(--faint); border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; }
.side-btn .gi { width: 18px; text-align: center; }
.side-scroll { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
.side-sec { margin-top: 10px; }
.side-label { display: flex; align-items: center; justify-content: space-between; padding: 4px 10px; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; font-weight: 700; color: var(--faint); }
.side-label button { width: 22px; height: 22px; border-radius: 7px; color: var(--muted); font-size: 16px; line-height: 1; opacity: 0; }
.side-sec:hover .side-label button, .side-label button:focus-visible { opacity: 1; }
.side-label button:hover { background: var(--hover); }
.side-empty { padding: 4px 12px 6px 30px; font-size: 13px; color: var(--faint); }
.tr { display: flex; align-items: center; gap: 2px; padding-left: calc(var(--d) * 14px + 4px); border-radius: calc(var(--r) * .6); position: relative; }
.tr:hover { background: var(--hover); }
.tr.cur { background: var(--accent-soft); }
.tr.cur .tr-name { color: var(--accent-ink); font-weight: 700; }
.tr-caret { width: 20px; height: 26px; border-radius: 6px; color: var(--faint); font-size: 10px; flex: none; transition: transform .15s; }
.tr-caret.open { transform: rotate(90deg); }
.tr-caret.none { visibility: hidden; }
.tr-main { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 0; padding: 4px 2px; text-align: left; }
.tr-ico { width: 20px; text-align: center; flex: none; font-size: 15px; }
.tr-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; font-weight: 600; color: var(--fg); opacity: .88; }
.tr-name.untitled { color: var(--faint); }
.tr-act { width: 22px; height: 22px; border-radius: 6px; color: var(--muted); opacity: 0; flex: none; font-size: 15px; line-height: 1; }
.tr:hover .tr-act, .tr-act:focus-visible { opacity: 1; }
.tr-act:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); }
.side-foot { border-top: 1px solid var(--line); padding: 10px 14px 12px; display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); }
.me { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--fg); font-size: 13.5px; }
.avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; }
.sync { display: flex; gap: 6px; align-items: flex-start; line-height: 1.4; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--c-mint-ink); margin-top: 5px; flex: none; }
.sync.local i { background: var(--c-butter-ink); }

/* ---------- Main ---------- */
#main { overflow-y: auto; overflow-x: hidden; position: relative; min-width: 0; height: 100%; }
#main[data-pattern="dots"] { background-image: radial-gradient(color-mix(in srgb, var(--accent) 45%, transparent) 1.1px, transparent 1.6px); background-size: 22px 22px; background-attachment: local; }
#main[data-pattern="grid"] { background-image: linear-gradient(color-mix(in srgb, var(--accent) 22%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--accent) 22%, transparent) 1px, transparent 1px); background-size: 26px 26px; background-attachment: local; }
#main[data-pattern="gingham"] { background-image: linear-gradient(90deg, color-mix(in srgb, var(--accent) 12%, transparent) 50%, transparent 50%), linear-gradient(color-mix(in srgb, var(--accent) 12%, transparent) 50%, transparent 50%); background-size: 32px 32px; background-attachment: local; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 6px; padding: 8px 14px 8px 12px; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); min-height: 48px; }
.crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; flex: 1; overflow: hidden; }
.crumb { display: flex; align-items: center; gap: 5px; padding: 3px 7px; border-radius: 8px; font-size: 14px; color: var(--muted); white-space: nowrap; min-width: 0; }
.crumb span.t { overflow: hidden; text-overflow: ellipsis; }
button.crumb:hover { background: var(--hover); color: var(--fg); }
.crumb.last { color: var(--fg); font-weight: 600; }
.crumb-sep { color: var(--faint); font-size: 13px; }
.scope-chip { font-size: 11.5px; font-weight: 800; letter-spacing: .04em; padding: 2px 8px; border-radius: 99px; background: var(--c-sky); color: var(--c-sky-ink); }
.scope-chip.private { background: var(--c-lilac); color: var(--c-lilac-ink); }
.status { font-size: 12.5px; color: var(--faint); white-space: nowrap; padding: 0 4px; }
.status.err { color: var(--danger); }
.tb-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: calc(var(--r) * .6); font-size: 13.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tb-btn:hover, .tb-btn.on { background: var(--hover); color: var(--fg); }
.tb-btn.on { background: var(--accent-soft); color: var(--accent-ink); }
.tb-btn .gi { font-size: 15px; }
.icon-btn { width: 32px; height: 32px; border-radius: calc(var(--r) * .6); display: inline-grid; place-items: center; color: var(--muted); font-size: 17px; flex: none; }
.icon-btn:hover { background: var(--hover); color: var(--fg); }
#menuBtn { display: none; }

/* ---------- Page ---------- */
#page { min-height: calc(100% - 48px); position: relative; }
.sheet { position: relative; padding-bottom: 30vh; }
.cover { height: 210px; position: relative; filter: brightness(var(--cover-dim)); }
.cover-tools { position: absolute; right: max(16px, 6vw); bottom: 12px; display: flex; gap: 6px; opacity: 0; transition: opacity .15s; }
.cover:hover .cover-tools, .cover-tools:focus-within { opacity: 1; }
.chip-btn { background: color-mix(in srgb, var(--card) 88%, transparent); color: var(--fg); border-radius: 99px; padding: 4px 12px; font-size: 12.5px; font-weight: 700; box-shadow: var(--shadow-sm); }
.chip-btn:hover { background: var(--card); }
.inner { max-width: 780px; margin: 0 auto; padding-inline: clamp(58px, 8vw, 100px); position: relative; }
.sheet.wide .inner { max-width: none; padding-inline: clamp(58px, 4.5vw, 80px); }
.icon-wrap { position: relative; height: 34px; }
.has-cover .icon-wrap { height: 52px; }
.page-icon { position: absolute; left: -6px; bottom: 0; width: 84px; height: 84px; border-radius: calc(var(--r) * 1.3); background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; font-size: 46px; transform: rotate(-4deg); transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
.page-icon:hover { transform: rotate(3deg) scale(1.05); }
.no-icon .icon-wrap { height: 22px; }
.page-tools { display: flex; flex-wrap: wrap; gap: 4px; margin: 18px 0 4px -8px; opacity: 0; transition: opacity .15s; }
.inner:hover .page-tools, .page-tools:focus-within { opacity: 1; }
.has-icon .page-tools { margin-top: 18px; }
.pt-btn { padding: 3px 9px; border-radius: 8px; font-size: 13px; color: var(--faint); font-weight: 600; }
.pt-btn:hover { background: var(--hover); color: var(--muted); }
.title { font-family: var(--font-display); font-size: clamp(30px, 5vw, 42px); font-weight: 650; line-height: 1.15; letter-spacing: -.01em; margin: 4px 0 6px; outline: none; text-wrap: balance; word-break: break-word; }
.title:empty::before { content: attr(data-ph); color: var(--faint); opacity: .6; }
.meta-line { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--faint); margin-bottom: 18px; }
.tpl-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 14px; align-items: center; }
.tpl-row .lbl { font-size: 13px; color: var(--faint); margin-right: 2px; }
.tpl-chip { display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); font-size: 13.5px; font-weight: 700; box-shadow: var(--shadow-sm); transition: transform .15s; }
.tpl-chip:hover { transform: translateY(-1px); border-color: var(--accent); }

/* ---------- Blocks ---------- */
.blocks { display: flex; flex-direction: column; }
.block { position: relative; border-radius: calc(var(--r) * .5); }
.block.drop-before { box-shadow: 0 -3px 0 0 var(--accent-strong); }
.block.drop-after { box-shadow: 0 3px 0 0 var(--accent-strong); }
.block.dragging { opacity: .4; }
.bh { position: absolute; left: -50px; top: 3px; display: flex; gap: 1px; opacity: 0; transition: opacity .12s; }
.block:hover > .bh, .bh:focus-within { opacity: 1; }
.bh button { width: 22px; height: 24px; border-radius: 6px; color: var(--faint); font-size: 16px; line-height: 1; display: grid; place-items: center; }
.bh .bh-drag { font-size: 12px; letter-spacing: -2px; cursor: grab; }
.bh button:hover { background: var(--hover); color: var(--muted); }
.bc { min-width: 0; }
.block[data-color] > .bc { border-radius: calc(var(--r) * .5); padding: 2px 8px; margin-inline: -8px; }
.ed { outline: none; padding: 3px 2px; min-height: 1.55em; word-break: break-word; white-space: pre-wrap; }
.ed:empty::before { content: attr(data-ph); color: var(--faint); pointer-events: none; }
.t-text > .bc > .ed:empty:not(:focus)::before { content: ""; }
.ed b { font-weight: 800; }
.ed code { font-family: var(--font-mono); font-size: .86em; background: var(--accent-soft); color: var(--accent-ink); padding: 1px 5px; border-radius: 6px; }
.ed mark { background: var(--c-butter); color: var(--c-butter-ink); padding: 0 2px; border-radius: 4px; }
.ed a { color: var(--accent-ink); text-decoration-color: var(--accent); }
.t-h1 .ed { font-family: var(--font-display); font-size: 1.85em; font-weight: 650; line-height: 1.25; margin-top: .9em; }
.t-h2 .ed { font-family: var(--font-display); font-size: 1.45em; font-weight: 650; line-height: 1.3; margin-top: .7em; }
.t-h3 .ed { font-family: var(--font-display); font-size: 1.18em; font-weight: 650; margin-top: .45em; }
.row { display: flex; gap: 6px; align-items: flex-start; }
.row > .ed { flex: 1; min-width: 0; }
.bullet-dot { width: 24px; flex: none; display: grid; place-items: center; height: 1.55em; margin-top: 3px; }
.bullet-dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent-strong); }
.num { width: 24px; flex: none; text-align: right; padding-top: 3px; color: var(--accent-ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.chk { width: 19px; height: 19px; flex: none; border-radius: 6px; border: 2px solid var(--accent); margin: 5px 3px 0 3px; display: grid; place-items: center; background: var(--card); transition: background .15s, transform .2s; }
.chk:hover { background: var(--accent-soft); }
.chk.on { background: var(--accent-strong); border-color: var(--accent-strong); }
.chk.on::after { content: ""; width: 5px; height: 9px; border: solid var(--card); border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.chk.popped { animation: pop .35s cubic-bezier(.3,1.8,.5,1); }
@keyframes pop { 0% { transform: scale(.7) } 60% { transform: scale(1.2) } 100% { transform: scale(1) } }
.done-text { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--accent); }
.quote-box { border-left: 4px solid var(--accent); padding-left: 14px; margin: 4px 0; }
.quote-box > .ed { font-size: 1.06em; font-style: italic; }
.callout { display: flex; gap: 10px; padding: 12px 14px; border-radius: calc(var(--r) * .8); background: var(--accent-soft); margin: 4px 0; }
.callout-main { flex: 1; min-width: 0; }
/* blocks inside blocks */
.kids { margin-left: 26px; display: flex; flex-direction: column; }
.callout-main > .kids, .quote-box > .kids, .toggle-body > .kids { margin-left: 0; }

.toggle-empty { color: var(--faint); font-size: 13.5px; padding: 3px 2px; text-align: left; }

.block.drop-inside::after { content: ""; position: absolute; left: 30px; right: 0; bottom: -2px; height: 3px; border-radius: 3px; background: var(--accent-strong); }
.mk { margin-left: auto; font-size: 11px; color: var(--faint); font-weight: 700; padding-left: 10px; }
.callout-ico { font-size: 20px; width: 28px; height: 28px; border-radius: 8px; flex: none; line-height: 28px; text-align: center; }
.callout-ico:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); }
.toggle-btn { width: 24px; height: 26px; flex: none; color: var(--muted); font-size: 11px; border-radius: 6px; transition: transform .15s; margin-top: 1px; }
.toggle-btn.open { transform: rotate(90deg); }
.toggle-btn:hover { background: var(--hover); }
.toggle-body { margin-left: 30px; border-left: 2px solid var(--line); padding-left: 10px; color: var(--fg); }
pre.ed.code { font-family: var(--font-mono); font-size: 13.5px; background: var(--card); border: 1px solid var(--line); border-radius: calc(var(--r) * .6); padding: 14px 16px; margin: 6px 0; overflow-x: auto; white-space: pre; tab-size: 2; }
.divider { padding: 12px 0; }
.divider.line hr { border: 0; height: 2px; background: var(--line); border-radius: 2px; margin: 0; }
.divider.dots { text-align: center; color: var(--accent); letter-spacing: 14px; font-size: 13px; user-select: none; }
.divider.flowers { text-align: center; color: var(--accent-strong); letter-spacing: 12px; user-select: none; }
.divider.wave hr { border: 0; height: 10px; margin: 0; background: radial-gradient(circle at 10px -4px, transparent 9px, var(--accent) 10px, transparent 11px) 0 0 / 20px 10px repeat-x; opacity: .8; }
.subpage { display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin: 2px -8px; border-radius: calc(var(--r) * .5); width: calc(100% + 16px); text-align: left; font-weight: 700; }
.subpage:hover { background: var(--hover); }
.subpage .t { border-bottom: 1px solid var(--line); }
.add-zone { min-height: 80px; cursor: text; }
.bg-pink { background: var(--c-pink); color: var(--c-pink-ink); } .bg-peach { background: var(--c-peach); color: var(--c-peach-ink); }
.bg-butter { background: var(--c-butter); color: var(--c-butter-ink); } .bg-mint { background: var(--c-mint); color: var(--c-mint-ink); }
.bg-sky { background: var(--c-sky); color: var(--c-sky-ink); } .bg-lilac { background: var(--c-lilac); color: var(--c-lilac-ink); }
.bg-gray { background: var(--c-gray); color: var(--c-gray-ink); }
.callout.bg-pink, .callout.bg-peach, .callout.bg-butter, .callout.bg-mint, .callout.bg-sky, .callout.bg-lilac, .callout.bg-gray { color: var(--fg); }

/* ---------- Columns ---------- */

.t-columns { padding-top: 26px; }

.col .block > .bh { opacity: .38; }

.block:focus-within > .bh { opacity: .8; }
.cols { display: flex; align-items: stretch; }

.col-gut { flex: 0 0 38px; position: relative; cursor: col-resize; touch-action: none; }

.col-gut:hover::after, .col-gut.active::after, .col-gut:focus-visible::after { background: var(--accent); }
.block.drop-left { box-shadow: -4px 0 0 0 var(--accent-strong); }
.block.drop-right { box-shadow: 4px 0 0 0 var(--accent-strong); }

/* ---------- Widgets ---------- */

.w-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }

.w-sub { font-size: 12.5px; color: var(--faint); }

*:hover > .mini-x, .mini-x:focus-visible { opacity: 1; }
@media (hover: none) { .mini-x { opacity: .6; } .bh { opacity: .45; } .page-tools, .cover-tools { opacity: 1; } .side-label button, .tr-act { opacity: .7; } }
.addf { display: flex; }
.addf input { flex: 1; min-width: 0; border: 1px dashed var(--line); background: transparent; border-radius: calc(var(--r) * .55); padding: 6px 10px; font-size: 13.5px; outline: none; }

.item { display: flex; align-items: flex-start; gap: 4px; padding: 5px 6px; border-radius: calc(var(--r) * .5); background: var(--card); box-shadow: var(--shadow-sm); border: 1px solid var(--line); cursor: grab; font-size: 14px; }
.item .chk { width: 17px; height: 17px; margin-top: 2px; border-radius: 5px; }
.item .chk.on::after { width: 4px; height: 8px; }
.ied { flex: 1; min-width: 0; outline: none; padding: 0 3px; border-radius: 4px; word-break: break-word; cursor: text; }
.ied:focus { background: var(--hover); }
.item.dragging, .kcard.dragging { opacity: .35; }

.mx-axes { display: grid; grid-template-columns: 22px 1fr 1fr; grid-template-rows: auto 1fr 1fr; gap: 10px; }
.mx-ax { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; color: var(--faint); text-align: center; }
.mx-ax.v { writing-mode: vertical-rl; transform: rotate(180deg); display: grid; place-items: center; }
.quad { border-radius: calc(var(--r) * 1); padding: 12px; min-height: 170px; display: flex; flex-direction: column; gap: 8px; border: 1.5px solid transparent; transition: border-color .15s, transform .15s; min-width: 0; }
.quad.over { border-style: dashed; transform: scale(1.01); }
.q-do { background: var(--q-do); border-color: var(--q-do-line); } .q-do .qn { color: var(--q-do-ink); }
.q-plan { background: var(--q-plan); border-color: var(--q-plan-line); } .q-plan .qn { color: var(--q-plan-ink); }
.q-delegate { background: var(--q-del); border-color: var(--q-del-line); } .q-delegate .qn { color: var(--q-del-ink); }
.q-drop { background: var(--q-drop); border-color: var(--q-drop-line); } .q-drop .qn { color: var(--q-drop-ink); }
.qh { display: flex; align-items: baseline; gap: 8px; }
.qn { font-family: var(--font-display); font-weight: 650; font-size: 16px; }
.qs { font-size: 11.5px; color: var(--muted); flex: 1; }
.qc { font-size: 12px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.qlist { display: flex; flex-direction: column; gap: 6px; flex: 1; }

.kb { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; align-items: flex-start; }
.kcol { flex: 0 0 236px; border-radius: calc(var(--r) * .9); background: color-mix(in srgb, var(--hover) 60%, transparent); padding: 10px; display: flex; flex-direction: column; gap: 8px; border: 1.5px dashed transparent; }
.kcol.over { border-color: var(--accent); }
.kh { display: flex; align-items: center; gap: 6px; }
.ktag { padding: 2px 10px; border-radius: 99px; font-size: 13px; font-weight: 800; outline: none; min-width: 30px; }
.kcount { font-size: 12px; color: var(--faint); font-weight: 700; flex: 1; }
.kcards { display: flex; flex-direction: column; gap: 7px; min-height: 30px; }
.kcard { background: var(--card); border: 1px solid var(--line); border-radius: calc(var(--r) * .6); padding: 8px 8px 8px 10px; box-shadow: var(--shadow-sm); display: flex; gap: 4px; cursor: grab; font-size: 14px; transition: transform .12s; }
.kcard:hover { transform: translateY(-1px); }
.kcard.drop-before { box-shadow: 0 -3px 0 var(--accent-strong); }
.kadd-col { flex: 0 0 160px; border: 1.5px dashed var(--line); border-radius: calc(var(--r) * .9); color: var(--faint); font-weight: 700; padding: 12px; font-size: 13.5px; }
.kadd-col:hover { border-color: var(--accent); color: var(--accent-ink); }

.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); text-align: center; padding-bottom: 2px; }
.cal-day { min-height: 92px; border-radius: calc(var(--r) * .55); background: var(--bg); padding: 4px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; border: 1px solid transparent; min-width: 0; text-align: left; }
.cal-day:hover { border-color: var(--accent); }
.cal-day.out { opacity: .45; }
.cal-num { font-size: 12.5px; font-weight: 700; color: var(--muted); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.cal-day.today .cal-num { background: var(--accent-strong); color: var(--card); }
.ev { font-size: 11.5px; font-weight: 700; padding: 1px 6px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; width: 100%; }
.ev-more { font-size: 11px; color: var(--faint); padding-left: 4px; }

.wk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.wk-day { background: var(--bg); border-radius: calc(var(--r) * .7); padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 170px; min-width: 0; border: 1px solid transparent; }
.wk-day.today { border-color: var(--accent); background: var(--accent-soft); }
.wk-h { display: flex; justify-content: space-between; align-items: baseline; }
.wk-dn { font-family: var(--font-display); font-weight: 650; }
.wk-dd { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.wk-list { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.wk-day .item { cursor: grab; font-size: 13px; padding: 4px; }
.wk-day.over { border-color: var(--accent); border-style: dashed; }
.wk-evs { display: flex; flex-direction: column; gap: 3px; margin-bottom: 2px; }
/* calendar: header, linked calendars, month chips */
.w-cal .w-head { row-gap: 8px; }
.cal-nav { display: inline-flex; align-items: center; gap: 4px; }
.cal-lbl { min-width: 128px; text-align: center; font-family: var(--font-display); white-space: nowrap; }
.cal-seg button { padding: 4px 11px; font-size: 12.5px; }
.cal-day.over, .tg-ac.over { border-color: var(--accent-strong); border-style: dashed; background: var(--accent-soft); }
.ev { display: flex; gap: 4px; align-items: baseline; }
.ev .ev-t { font-weight: 800; opacity: .75; flex: none; font-variant-numeric: tabular-nums; }
.ev .ev-n { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ev.feed, .tg-ev.feed { background: color-mix(in srgb, var(--evc) 40%, var(--card)); color: var(--fg); box-shadow: inset 3px 0 0 color-mix(in srgb, var(--evc) 100%, #000 12%); }
.ev.done .ev-n, .tg-ev.done b { text-decoration: line-through; opacity: .6; }
.ev[draggable="true"], .tg-ev[draggable="true"] { cursor: grab; }
button.ev-more { text-align: left; }
button.ev-more:hover { color: var(--accent-ink); }
.day-list { display: grid; gap: 4px; }
.feed-notes { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--faint); margin: -4px 0 8px; }
.cal-pop { display: grid; gap: 6px; max-height: min(75vh, 620px); overflow: auto; }
.feed-row { display: flex; align-items: center; gap: 8px; padding: 4px 2px; font-size: 14px; }
.feed-row input[type=checkbox] { accent-color: var(--accent-strong); }
.feed-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.feed-add { display: grid; gap: 8px; padding: 10px; border-radius: calc(var(--r) * .7); background: var(--bg); margin-top: 4px; }
.feed-add select { border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 6px; }
.feed-msg { font-size: 13px; padding: 6px 10px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; }
.feed-help { font-size: 13px; color: var(--muted); }
.feed-help summary { cursor: pointer; font-weight: 700; color: var(--accent-ink); padding: 4px 0; }
.feed-help p { margin: 6px 0; line-height: 1.45; }
.switch.small { gap: 6px; font-size: 13px; white-space: nowrap; }
.switch.small input { width: 34px; height: 19px; }
.switch.small input::after { width: 13px; height: 13px; }
.switch.small input:checked::after { left: 18px; }
/* calendar: week and day time grid */
.tg { overflow-x: auto; }
.tg.week .tg-in { min-width: 640px; }
.tg-row { display: grid; }
.tg-head, .tg-all { overflow-y: hidden; scrollbar-gutter: stable; }
.tg-dh { text-align: center; padding: 2px 0 6px; display: grid; gap: 1px; }
.tg-dn { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.tg-dd { font-family: var(--font-display); font-weight: 650; font-size: 18px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto; }
.tg-dh.today .tg-dd { background: var(--accent-strong); color: var(--card); }
.tg-all { border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.tg-gl { font-size: 10.5px; color: var(--faint); font-weight: 700; text-align: right; padding: 4px 6px 0 0; }
.tg-ac { min-height: 26px; display: flex; flex-direction: column; gap: 2px; padding: 2px; border: 1px dashed transparent; border-radius: 8px; cursor: pointer; min-width: 0; }
.tg-ac:hover { border-color: var(--line); }
.tg-scroll { height: 520px; max-height: 65vh; overflow-y: auto; scrollbar-gutter: stable; position: relative; }
.tg-body { display: grid; position: relative; }
.tg-hours { position: relative; }
.tg-hours span { position: absolute; right: 6px; transform: translateY(-50%); font-size: 10.5px; color: var(--faint); font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tg-col { position: relative; border-left: 1px solid var(--line); background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px); cursor: pointer; min-width: 0; }
.tg-col.today { background-color: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.tg-col.over { background-color: color-mix(in srgb, var(--accent-soft) 70%, transparent); }
.tg-ev { position: absolute; border-radius: 8px; padding: 3px 6px; font-size: 12px; line-height: 1.25; overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-sm); border: 1px solid color-mix(in srgb, var(--fg) 8%, transparent); z-index: 1; cursor: pointer; }
.tg-ev b { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tg-ev small { opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.tg-ev.dragging { opacity: .4; }
.tg-ev.short { flex-direction: row; align-items: baseline; gap: 5px; padding-block: 1px; }
.tg-ev.short small { flex: none; }
.tg-ev.resizing { z-index: 3; box-shadow: var(--shadow); }
.tg-rs { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; cursor: ns-resize; }
.tg-rs::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 18px; height: 3px; margin-left: -9px; border-radius: 3px; background: currentColor; opacity: 0; }
.tg-ev:hover .tg-rs::after { opacity: .4; }
.tg-now { position: absolute; left: 0; right: 0; height: 2px; background: var(--danger); z-index: 2; pointer-events: none; }
.tg-now::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--danger); }
.tg-ghost { position: absolute; left: 2px; right: 2px; border-radius: 8px; border: 2px dashed var(--accent-strong); background: color-mix(in srgb, var(--accent) 25%, transparent); font-size: 11px; font-weight: 800; color: var(--accent-ink); padding: 2px 6px; pointer-events: none; z-index: 2; }
.tg-col:not(.over) .tg-ghost { display: none; }
.wk-day .addf input { padding: 4px 8px; font-size: 12.5px; }

.hb { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
.hb-wrap { overflow-x: auto; }
.hb th { font-size: 11px; font-weight: 800; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; padding: 0 2px; text-align: center; }
.hb th.l { text-align: left; }
.hb th.td { color: var(--accent-ink); }
.hb td { text-align: center; padding: 0 2px; }
.hb td.l { text-align: left; min-width: 140px; }
.hname { display: flex; gap: 6px; align-items: center; font-weight: 700; }
.hico { font-size: 17px; width: 26px; height: 26px; border-radius: 8px; flex: none; }
.hico:hover { background: var(--hover); }
.hdot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); transition: transform .2s cubic-bezier(.3,1.8,.5,1), background .15s; display: inline-grid; place-items: center; font-size: 14px; }
.hdot:hover { border-color: var(--accent); }
.hdot.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); transform: scale(1.06); }
.streak { font-size: 12.5px; font-weight: 800; color: var(--accent-ink); white-space: nowrap; font-variant-numeric: tabular-nums; }

.mood-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; max-width: 460px; }
.mday { aspect-ratio: 1; max-width: 100%; border-radius: calc(var(--r) * .6); background: var(--bg); display: grid; place-items: center; font-size: 18px; position: relative; border: 1px solid transparent; }
.mday:hover { border-color: var(--accent); }
.mday .dn { position: absolute; top: 3px; left: 5px; font-size: 10px; font-weight: 700; color: var(--faint); font-variant-numeric: tabular-nums; }
.mday.today { border-color: var(--accent-strong); }
.mday.blank { background: transparent; pointer-events: none; }
.mood-sum { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.mood-sum span { font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 99px; }
.mood-wrap { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
.mood-legend { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }

.pomo { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
.ring { position: relative; width: 150px; height: 150px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { stroke: var(--accent-soft); }
.ring .prg { stroke: var(--accent-strong); transition: stroke-dashoffset .3s linear; }
.ring .tm { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 32px; font-weight: 650; font-variant-numeric: tabular-nums; }
.pomo-side { display: grid; gap: 10px; flex: 1; min-width: 200px; }
.seg { display: inline-flex; background: var(--bg); border-radius: 99px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { padding: 5px 12px; border-radius: 99px; font-size: 13px; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-sm); }
.btn { padding: 8px 18px; border-radius: 99px; font-weight: 800; font-size: 14px; background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-sm); transition: transform .15s; }
.btn:hover { transform: translateY(-1px); }
.btn.ghost { background: var(--hover); color: var(--fg); }
.btn.danger { background: var(--danger); color: var(--card); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.tomatoes { font-size: 13px; color: var(--muted); }

/* ---------- Team dragon ---------- */
.dragon { --dh: 155; --ds: 50%; --dg-line: hsl(var(--dh) calc(var(--ds) * .7) 38%); position: relative; display: inline-block; line-height: 0; }
.dragon svg { width: 100%; height: 100%; overflow: visible; }
.dragon svg .o { stroke: var(--dg-line); stroke-width: 3; stroke-linejoin: round; }
.dg-bd { fill: hsl(var(--dh) var(--ds) 80%); }
.dg-wg { fill: hsl(var(--dh) var(--ds) 70%); }
.dg-dk { fill: hsl(var(--dh) var(--ds) 63%); }
.dg-bl { fill: hsl(45 100% 92%); }
.dg-bl2 { fill: none; stroke: hsl(38 70% 78%); stroke-width: 2.5; stroke-linecap: round; }
.dg-hn { fill: hsl(42 85% 84%); }
.dg-ck { fill: #ff8fb1; opacity: .45; transition: opacity .2s; }
.dg-toe { stroke: var(--dg-line); stroke-width: 2; stroke-linecap: round; }
.dg-ns { fill: var(--dg-line); }
.dg-mouth, .dg-cl { fill: none; stroke: #2b1f2e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.dg-shadow { fill: #000; opacity: .08; }
.dg-eggshell { fill: #fff8ec; }
.dg-crack { fill: none; stroke: #b79b74; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; opacity: 0; transition: opacity .2s; }
.cr1 .c1, .cr2 .c1, .cr2 .c2, .cr3 .dg-crack { opacity: 1; }
.p-shell { fill: #fffaf2; stroke: #e6d7bd; stroke-width: 2.5; stroke-linejoin: round; }
.dragon .p-shell, .dragon .p-horns, .dragon .p-spikes, .dragon .p-crown, .dg-cl, .dg-mo, .dg-fire { display: none; }
.st-1 .p-shell, .ge-2 .p-horns, .ge-3 .p-spikes, .ge-5 .p-crown { display: inline; }
.st-0 .dg-grow { display: none; }
.dragon:not(.st-0) .dg-egg { display: none; }
.dg-grow { transform-origin: 100px 192px; transform: scale(.8); transition: transform .6s cubic-bezier(.3,1.6,.5,1); }
.ge-2 .dg-grow { transform: scale(.87); } .ge-3 .dg-grow { transform: scale(.93); } .ge-4 .dg-grow { transform: scale(1); }
.dg-wing { transform: scale(.55); transition: transform .5s; }
.dg-wing.l { transform-origin: 70px 106px; } .dg-wing.r { transform-origin: 130px 106px; }
.ge-2 .dg-wing { transform: scale(.72); } .ge-3 .dg-wing { transform: scale(.9); } .ge-4 .dg-wing { transform: scale(1.05); } .ge-5 .dg-wing { transform: scale(1.12); }
.dg-wing.l .dg-flap { transform-origin: 70px 106px; animation: dgFlapL 2.4s ease-in-out infinite; }
.dg-wing.r .dg-flap { transform-origin: 130px 106px; animation: dgFlapR 2.4s ease-in-out infinite; }
@keyframes dgFlapL { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-10deg); } }
@keyframes dgFlapR { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(10deg); } }
.dg-tail { transform-origin: 136px 148px; animation: dgWag 3s ease-in-out infinite; }
@keyframes dgWag { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(7deg); } }
.dg-bob { transform-origin: 100px 190px; animation: dgBob 2.8s ease-in-out infinite; }
@keyframes dgBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.dg-act { transform-origin: 100px 190px; }
.dg-eye { transition: transform .08s; }
.dg-look { transform: translate(calc(var(--ex, 0) * 3.5px), calc(var(--ey, 0) * 3px)); transition: transform .12s ease-out; }
.blink .dg-eye { transform: scaleY(.12); }
/* sleeping (idle nap or focus timer) */
.sleep .dg-open, .focus .dg-open { display: none; }
.sleep .dg-cl-sleep, .focus .dg-cl-sleep { display: inline; }
.sleep .dg-bob, .focus .dg-bob { animation-duration: 4.5s; }
.sleep .dg-flap, .focus .dg-flap { animation: none; }
.dg-zz text { font: 800 15px var(--font-display); fill: var(--dg-line); opacity: 0; }
.sleep .dg-zz text, .focus .dg-zz text { animation: dgZ 2.4s ease-in-out infinite; }
.dg-zz text:nth-child(2) { animation-delay: .8s !important; } .dg-zz text:nth-child(3) { animation-delay: 1.6s !important; }
@keyframes dgZ { 0% { opacity: 0; transform: translateY(6px); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateY(-10px); } }
/* hungry thought bubble */
.dg-think { opacity: 0; transition: opacity .3s; }
.dg-think circle, .dg-think ellipse { fill: var(--card, #fff); stroke: var(--line, #ddd); stroke-width: 2; }
.dg-think text { font-size: 17px; }
.hungry:not(.sleep):not(.focus):not(.st-0):not([class*=" a-"]) .dg-think { opacity: 1; }
/* actions */
.a-happy .dg-open, .a-pet .dg-open { display: none; }
.a-happy .dg-cl-happy, .a-pet .dg-cl-happy { display: inline; }
.a-pet .dg-ck { opacity: .85; }
.a-happy .dg-mouth, .a-eat .dg-mouth, .a-yawn .dg-mouth, .a-fire .dg-mouth { display: none; }
.a-happy .dg-mo, .a-eat .dg-mo, .a-yawn .dg-mo, .a-fire .dg-mo { display: inline; }
.dg-mo { transform-origin: 100px 107px; }
.a-eat .dg-mo { animation: dgChomp .22s ease-in-out 5; }
@keyframes dgChomp { 50% { transform: scaleY(.25); } }
.a-yawn .dg-mo { transform: scale(1.5, 1.8); transition: transform .4s; }
.a-yawn .dg-open { display: none; } .a-yawn .dg-cl-sleep { display: inline; }
.a-yawn .dg-act { animation: dgStretch 1.6s ease-in-out; }
@keyframes dgStretch { 40%, 60% { transform: scale(.97, 1.05); } }
.a-happy .dg-act { animation: dgJump .8s ease; }
@keyframes dgJump { 25% { transform: translateY(4px) scale(1.06, .92); } 55% { transform: translateY(-22px) scale(.95, 1.06); } 80% { transform: translateY(2px) scale(1.04, .96); } }
.a-pet .dg-act { animation: dgSquish .6s ease; }
@keyframes dgSquish { 30% { transform: scale(1.07, .93); } 60% { transform: scale(.97, 1.03); } }
.a-dance .dg-act { animation: dgDance 1.4s ease-in-out; }
@keyframes dgDance { 20%, 60% { transform: rotate(-9deg) translateX(-6px); } 40%, 80% { transform: rotate(9deg) translateX(6px); } }
.a-spin .dg-act { animation: dgSpin .9s ease-in-out; }
@keyframes dgSpin { 25% { transform: scaleX(.1); } 50% { transform: scaleX(-1); } 75% { transform: scaleX(.1); } }
.a-fire .dg-act { animation: dgBlow 1.5s ease; }
@keyframes dgBlow { 15% { transform: rotate(-4deg) translateY(-3px); } 35%, 85% { transform: rotate(2deg) translateY(2px); } }
.a-fire .dg-fire { display: inline; }
.dg-fire circle { transform-box: fill-box; transform-origin: center; opacity: 0; }
.dg-fire .f1 { fill: #ffb347; animation: dgF1 .5s ease-out .25s 3; } .dg-fire .f2 { fill: #ff7a45; animation: dgF2 .5s ease-out .35s 3; }
.dg-fire .f3 { fill: #ffd86b; animation: dgF3 .5s ease-out .3s 3; } .dg-fire .f4 { fill: #ff9a3c; animation: dgF4 .5s ease-out .4s 3; }
@keyframes dgF1 { 0% { opacity: 1; transform: translate(0, 0) scale(.3); } 100% { opacity: 0; transform: translate(-28px, 46px) scale(2.3); } }
@keyframes dgF2 { 0% { opacity: 1; transform: translate(0, 0) scale(.3); } 100% { opacity: 0; transform: translate(0, 60px) scale(2.7); } }
@keyframes dgF3 { 0% { opacity: 1; transform: translate(0, 0) scale(.3); } 100% { opacity: 0; transform: translate(26px, 44px) scale(2.1); } }
@keyframes dgF4 { 0% { opacity: 1; transform: translate(0, 0) scale(.3); } 100% { opacity: 0; transform: translate(12px, 32px) scale(1.7); } }
.a-fly .dg-flap { animation-duration: .28s !important; }
.a-grow .dg-grow { animation: dgGrow 1.2s cubic-bezier(.3,1.6,.5,1); }
@keyframes dgGrow { 0% { filter: brightness(1.6); } 40% { filter: brightness(1.3) drop-shadow(0 0 12px #ffe37a); } 100% { filter: none; } }
/* egg */
.dg-eggin { transform-origin: 100px 186px; animation: dgRock 4.5s ease-in-out infinite; }
@keyframes dgRock { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-5deg); } 90% { transform: rotate(5deg); } 95% { transform: rotate(-3deg); } }
.a-wobble .dg-eggin { animation: dgWobble .45s ease 2; }
@keyframes dgWobble { 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
.calm .dg-bob, .calm .dg-flap, .calm .dg-tail, .calm .dg-eggin { animation: none !important; }
@media (prefers-reduced-motion: reduce) { .dg-bob, .dg-flap, .dg-tail, .dg-eggin { animation: none !important; } }
/* speech bubble + effects */
.dg-say { position: absolute; bottom: calc(100% + 4px); right: 4px; z-index: 3; width: max-content; max-width: 230px; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 16px 16px 4px 16px; padding: 7px 11px; font-size: 13px; font-weight: 700; line-height: 1.35; box-shadow: var(--shadow); opacity: 0; transform: translateY(6px) scale(.92); transform-origin: bottom right; transition: opacity .18s, transform .22s cubic-bezier(.3,1.6,.5,1); pointer-events: none; }
.dg-say.show { opacity: 1; transform: none; }
.dg-fx { position: absolute; pointer-events: none; font-size: 17px; line-height: 1; z-index: 4; }
.dg-plus { font: 800 15px var(--font-display); color: var(--accent-ink); text-shadow: 0 1px 0 var(--card); }
/* corner buddy */
.dg-quick { display: grid; gap: 8px; padding: 4px; }
.dg-ask { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; font-size: 15px; padding: 10px 14px; }
.dg-quick-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; justify-content: center; }
#dragonBuddy { position: fixed; right: calc(14px + var(--dx, 0px)); bottom: calc(10px + var(--dy, 0px) + env(safe-area-inset-bottom, 0px)); z-index: 44; width: 92px; height: 92px; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; }
#dragonBuddy:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 20px; }
#dragonBuddy.dragging { cursor: grabbing; }
body:has(#agentPanel.open) #dragonBuddy { right: calc(min(420px, 100vw) + 10px + var(--dx, 0px)); }
.dg-more { position: absolute; top: -2px; left: -4px; width: 26px; height: 26px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-sm); color: var(--muted); font-size: 14px; line-height: 1; opacity: 0; transition: opacity .15s; z-index: 5; }
#dragonBuddy:hover .dg-more, .dg-more:focus-visible { opacity: 1; }
@media (hover: none) { .dg-more { opacity: .7; } }
@media (max-width: 700px) { #dragonBuddy { width: 70px; height: 70px; } body:has(#agentPanel.open) #dragonBuddy, body:has(.stk-tray) #dragonBuddy { display: none; } }
.dg-menu { width: 270px; display: grid; gap: 8px; }
.dg-menu .dg-row { display: flex; flex-wrap: wrap; gap: 6px; }
.dg-bar { height: 9px; border-radius: 99px; background: var(--hover); overflow: hidden; }
.dg-bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-strong)); transition: width .6s cubic-bezier(.3,1.4,.5,1); }
.dg-treats { display: flex; gap: 4px; }
.dg-treats button { font-size: 26px; width: 48px; height: 48px; border-radius: 12px; }
.dg-treats button:hover { background: var(--hover); transform: translateY(-2px); }
/* den block */
.w-dragon { overflow: hidden; }
.den { display: grid; grid-template-columns: minmax(200px, 300px) 1fr; gap: 18px; align-items: start; }
@container (max-width: 520px) { .den { grid-template-columns: 1fr; } }
.den-scene { position: relative; height: 240px; border-radius: calc(var(--r) * 1.1); background: radial-gradient(circle at 78% 22%, #fff7c4 0 16px, transparent 17px), linear-gradient(180deg, hsl(var(--h) 80% 93%) 0%, hsl(calc(var(--h) + 40) 70% 95%) 70%, hsl(95 45% 86%) 70.5%, hsl(95 40% 80%) 100%); overflow: visible; }
.den-scene .cloud { position: absolute; top: 26px; left: 18px; width: 54px; height: 18px; border-radius: 99px; background: #fff; opacity: .9; box-shadow: 18px -8px 0 2px #fff; }
.den-scene .dragon { position: absolute; left: 50%; bottom: 30px; width: 170px; height: 170px; margin-left: -85px; cursor: pointer; }
.den-scene .dg-say { right: auto; left: 60%; border-radius: 16px 16px 16px 4px; transform-origin: bottom left; }
.den-nest { position: absolute; left: 50%; bottom: 14px; width: 210px; height: 56px; margin-left: -105px; pointer-events: none; }
.den-nest.back { z-index: 0; } .den-nest.front { z-index: 2; }
.den-info { display: grid; gap: 10px; min-width: 0; }
.den-name { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 650; font-size: 24px; }
.den-chip { white-space: nowrap; font: 800 11.5px var(--font-body); padding: 3px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent-ink); letter-spacing: .02em; }
.den-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.den-stat { background: var(--bg); border-radius: calc(var(--r) * .7); padding: 8px 10px; font-size: 13px; color: var(--muted); }
.den-stat b { display: block; color: var(--fg); font-size: 15px; }
.den-helpers { display: flex; flex-wrap: wrap; gap: 6px; }
.den-helpers span { font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--bg); }
.dg-hues { display: flex; gap: 8px; flex-wrap: wrap; }
.dg-hues button { width: 54px; height: 54px; border-radius: 16px; border: 2px solid transparent; background: var(--bg); padding: 2px; }
.dg-hues button.on { border-color: var(--accent-strong); background: var(--accent-soft); }
.dg-hues .dragon { width: 46px; height: 46px; pointer-events: none; }
.hatch-stage { display: grid; place-items: center; }
.hatch-stage .dragon { width: 150px; height: 150px; }


/* ---------- Selecting blocks ---------- */
.block.bsel::before { content: ""; position: absolute; inset: -2px -6px; border-radius: calc(var(--r) * .5); background: color-mix(in srgb, var(--accent) 24%, transparent); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent-strong) 55%, transparent); pointer-events: none; z-index: 3; }
.block.bsel .block.bsel::before { display: none; }
.rubber { position: fixed; z-index: 60; background: color-mix(in srgb, var(--accent) 18%, transparent); border: 1.5px solid var(--accent-strong); border-radius: 6px; pointer-events: none; }
body.rubbering, body.rubbering * { user-select: none !important; -webkit-user-select: none !important; cursor: default; }
.sel-bar { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 6px 8px 6px 16px; box-shadow: var(--shadow); font-size: 13.5px; animation: popIn .16s; max-width: calc(100vw - 24px); flex-wrap: wrap; }
.sel-bar b { margin-right: 4px; white-space: nowrap; }
body:has(.sel-bar) .toast { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
.pill-btn.danger { background: color-mix(in srgb, var(--danger) 14%, var(--card)); color: var(--danger); }
.pill-btn.danger:hover { background: var(--danger); color: var(--card); }
.undo-btn { font-size: 18px; }
.undo-btn:disabled { opacity: .3; cursor: default; background: none !important; }
.toast.has-act { display: flex; align-items: center; gap: 12px; padding-right: 8px; }
.toast-act { background: color-mix(in srgb, var(--bg) 22%, transparent); color: var(--bg); padding: 4px 12px; border-radius: 99px; font-weight: 800; font-size: 13px; }
.toast-act:hover { background: var(--bg); color: var(--fg); }

/* ---------- Page history ---------- */
.hist { display: grid; grid-template-columns: 210px 1fr; gap: 14px; min-height: 360px; }
@media (max-width: 640px) { .hist { grid-template-columns: 1fr; } .hist-list { max-height: 180px; } }
.hist-list { display: flex; flex-direction: column; gap: 2px; max-height: 60vh; overflow-y: auto; border-right: 1px solid var(--line); padding-right: 8px; }
.hist-item { display: grid; text-align: left; padding: 7px 10px; border-radius: 10px; gap: 1px; font-size: 13.5px; }
.hist-item:hover { background: var(--hover); }
.hist-item[aria-selected="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.hist-view { min-width: 0; display: grid; grid-template-rows: auto 1fr; gap: 10px; }
.hist-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.hist-preview { white-space: pre-wrap; font-size: 13.5px; line-height: 1.55; background: var(--bg); border-radius: calc(var(--r) * .7); padding: 12px 14px; max-height: 52vh; overflow: auto; color: var(--muted); }
/* ---------- AI persona ---------- */
.msg.assistant.has-av { position: relative; margin-left: 36px; max-width: calc(94% - 36px); }
.msg-av { position: absolute; left: -36px; bottom: -2px; width: 30px; height: 30px; }
.msg-av.sparkle { display: grid; place-items: center; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); font-size: 15px; }
.ai-persona textarea { resize: vertical; min-height: 84px; font: inherit; }
.ai-persona .chips { display: flex; flex-wrap: wrap; gap: 6px; }
/* ---------- Databases ---------- */
.w-db { padding-bottom: 10px; }
.w-db .w-head { row-gap: 8px; }
.db-search { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 4px 12px; font-size: 13px; width: 150px; outline: none; }
.db-search:focus { border-color: var(--accent); background: var(--card); }
.db-tabs { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin: -4px 0 10px; }
.db-tab { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; font-size: 13px; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; border-radius: 8px 8px 0 0; }
.db-tab:hover { background: var(--hover); color: var(--fg); }
.db-tab.on { color: var(--fg); border-bottom-color: var(--accent-strong); }
.db-tab.add { color: var(--faint); font-size: 16px; padding: 4px 10px; }
.db-caret { font-size: 10px; color: var(--faint); }
.db-sortnote { margin-left: auto; font-size: 12px; color: var(--faint); padding: 0 6px; }
.db-ti { font-size: 12px; color: var(--faint); width: 16px; text-align: center; flex: none; }
.db-chip { display: inline-flex; align-items: center; padding: 1px 9px; border-radius: 99px; font-size: 12.5px; font-weight: 700; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; line-height: 1.6; }
.db-chip.sm { font-size: 11.5px; padding: 0 7px; }
.db-empty { color: var(--faint); font-size: 13px; }
/* table */
.db-scroll { overflow-x: auto; margin: 0 -14px; padding: 0 14px; }
.db-table { border-collapse: separate; border-spacing: 0; min-width: 100%; font-size: 14px; }
.db-table th, .db-table td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; text-align: left; vertical-align: top; min-width: 130px; max-width: 280px; background: var(--card); }
.db-table th:last-child, .db-table td:last-child { border-right: 0; }
.db-table thead th { border-bottom-width: 1.5px; }
.db-table .db-title { position: sticky; left: 0; z-index: 1; min-width: 200px; box-shadow: 1px 0 0 var(--line); }
.db-table .t-checkbox { min-width: 76px; }
.db-table .t-number { min-width: 110px; }
.db-table .db-addcol { min-width: 44px; width: 44px; }
.db-th { display: flex; align-items: center; gap: 6px; width: 100%; padding: 7px 8px; font-size: 12.5px; font-weight: 800; color: var(--muted); white-space: nowrap; text-align: left; }
.db-th:hover { background: var(--hover); color: var(--fg); }
.db-addcol .db-th { justify-content: center; font-size: 16px; color: var(--faint); }
.db-tcell { display: flex; align-items: flex-start; gap: 4px; padding: 6px 6px 6px 8px; }
.db-title-ed { flex: 1; font-weight: 700; min-height: 1.4em; }
.db-title-ed:empty::before, .db-ed:empty::before { content: attr(data-ph); color: var(--faint); font-weight: 600; }
.db-open { flex: none; font-size: 11.5px; font-weight: 800; color: var(--muted); padding: 1px 7px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); opacity: 0; transition: opacity .12s; white-space: nowrap; }
.db-open:hover { background: var(--hover); color: var(--fg); }
.db-table tr:hover .db-open, .db-open:focus-visible { opacity: 1; }
.db-table tr:hover td { background: color-mix(in srgb, var(--hover) 55%, var(--card)); }
.db-txt { display: flex; align-items: flex-start; gap: 4px; padding: 6px 8px; min-height: 34px; cursor: text; }
.db-txt .ied { flex: 1; padding: 0; }
.db-ed.dbnum { text-align: right; font-variant-numeric: tabular-nums; }
.db-go { flex: none; font-size: 12px; font-weight: 800; color: var(--accent-ink); text-decoration: none; padding: 0 4px; border-radius: 4px; }
.db-go:hover { background: var(--accent-soft); }
.db-pick { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; width: 100%; min-height: 34px; padding: 5px 8px; text-align: left; font-size: 14px; }
.db-pick:not(:disabled):hover { background: var(--hover); }
.db-pick:disabled { cursor: default; color: inherit; }
.db-pick.overdue { color: var(--danger); font-weight: 700; }
.db-cb { padding: 3px 6px; }
.db-person { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; }
.db-person .avatar { width: 20px; height: 20px; font-size: 10.5px; }
.db-none { padding: 14px 10px; color: var(--faint); font-size: 13.5px; text-align: center; }
.db-newrow { width: 100%; text-align: left; padding: 7px 10px; font-size: 13.5px; font-weight: 700; color: var(--faint); }
.db-newrow:hover { background: var(--hover); color: var(--muted); }
.db-count { display: block; padding: 7px 10px; font-size: 12.5px; color: var(--faint); }
.db-table tfoot td { border-bottom: 0; }
.db-agg { width: 100%; text-align: right; padding: 7px 8px; font-size: 12.5px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.db-agg.ghost { color: transparent; }
.db-table tfoot:hover .db-agg.ghost { color: var(--faint); }
.db-agg:not(:disabled):hover { background: var(--hover); }
/* board, gallery, cards */
.db-board .kcol { flex-basis: 250px; }
.db-card { flex-direction: column; gap: 5px; cursor: pointer; }
.db-ct { font-weight: 800; font-size: 14px; word-break: break-word; }
.db-cp { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; font-size: 12.5px; color: var(--muted); min-width: 0; }
.db-cpn { color: var(--faint); font-weight: 700; }
.db-newcard { text-align: left; padding: 6px 8px; border-radius: calc(var(--r) * .5); color: var(--faint); font-weight: 700; font-size: 13px; }
.db-newcard:hover { background: var(--card); color: var(--muted); }
.db-gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.db-gcard { background: var(--card); border: 1px solid var(--line); border-radius: calc(var(--r) * .8); overflow: hidden; box-shadow: var(--shadow-sm); cursor: pointer; text-align: left; display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; min-width: 0; }
.db-gcard:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.db-gcover { height: 112px; display: grid; place-items: center; font-family: var(--font-display); font-size: 40px; font-weight: 650; overflow: hidden; }
.db-gcover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.db-gbody { padding: 10px 12px 12px; display: grid; gap: 6px; }
.db-gcard.add { border-style: dashed; box-shadow: none; display: grid; place-items: center; min-height: 160px; color: var(--faint); font-weight: 800; }
.db-gcard.add:hover { color: var(--accent-ink); border-color: var(--accent); }
.db-cal .cal-nav { margin-bottom: 8px; flex-wrap: wrap; }
.db-cal .cal-day.over { border-color: var(--accent-strong); border-style: dashed; background: var(--accent-soft); }
.db-cal .ev { cursor: pointer; }
.db-cal .ev[draggable="true"] { cursor: grab; }
.db-undated { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
.db-undated .db-chip { cursor: pointer; }
.db-card.dragging, .db-cal .ev.dragging { opacity: .4; }
/* popovers and the row page */
.db-opt-pop { display: grid; gap: 6px; }
.db-opt-pop .mlist { max-height: 260px; overflow: auto; }
.db-types { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.db-prop-pop { display: grid; gap: 8px; }
.db-prop-pop .pop-row select { flex: 1; border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 5px 6px; font-size: 13.5px; min-width: 0; }
.db-prop-pop .pop-row > .w-sub { width: 58px; flex: none; }
.db-opts { display: grid; gap: 4px; }
.db-opt-row { display: flex; gap: 6px; align-items: center; }
.db-opt-row .field { padding: 4px 8px; font-size: 13px; }
.db-opt-row .mini-x { opacity: .6; }
.db-row-page { display: grid; gap: 12px; }
.db-row-title { font-family: var(--font-display); font-size: 26px; font-weight: 650; border: 0; outline: none; background: transparent; color: var(--fg); padding: 2px 0; width: 100%; }
.db-row-title::placeholder { color: var(--faint); }
.db-form { display: grid; gap: 2px; }
.db-frow { display: grid; grid-template-columns: 150px 1fr; align-items: start; gap: 8px; border-radius: 8px; }
.db-frow:hover { background: color-mix(in srgb, var(--hover) 50%, transparent); }
.db-flbl { display: flex; align-items: center; gap: 6px; padding: 7px 4px; font-size: 13.5px; color: var(--muted); font-weight: 700; min-width: 0; }
.db-flbl span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.db-fval { min-width: 0; }
.db-notes { width: 100%; resize: vertical; font: inherit; line-height: 1.5; }
@media (max-width: 560px) { .db-frow { grid-template-columns: 1fr; gap: 0; } .db-flbl { padding-bottom: 0; } .db-search { width: 110px; } }

/* ---------- Everyday life + goals ---------- */
.l-field { width: 100%; }
textarea.l-field { resize: vertical; line-height: 1.5; }
/* grocery */
.l-groups { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); align-items: start; }
.l-group { display: grid; gap: 6px; min-width: 0; }
.l-gh { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.l-gh b { flex: 1; font-family: var(--font-display); font-weight: 650; }
.l-gitem { cursor: default; align-items: center; }
.l-gitem .chk { margin-top: 0; }
.l-qty { font-size: 12px; font-weight: 800; color: var(--accent-ink); background: var(--accent-soft); border-radius: 99px; padding: 1px 8px; min-width: 18px; outline: none; white-space: nowrap; max-width: 90px; overflow: hidden; }
.l-qty:empty { background: transparent; padding: 1px 4px; }
.l-qty:empty::before { content: attr(data-ph); color: var(--faint); font-weight: 600; opacity: 0; }
.l-gitem:hover .l-qty:empty::before, .l-qty:empty:focus::before { opacity: 1; }
.l-cart { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 8px; }
.l-cart-h { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); padding: 2px 0; }
.l-cart-h .toggle-btn { width: 20px; height: 20px; display: inline-grid; place-items: center; }
.l-cart .qlist { margin-top: 6px; opacity: .75; }
/* meals */
.l-meals-wrap { overflow-x: auto; }
.l-meals { display: grid; grid-template-columns: 84px repeat(7, minmax(60px, 1fr)); gap: 5px; min-width: 540px; }
.l-mh { text-align: center; display: grid; gap: 0; font-size: 12px; color: var(--faint); padding-bottom: 2px; }
.l-mh b { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 800; }
.l-mh span { font-family: var(--font-display); font-size: 16px; font-weight: 650; color: var(--fg); }
.l-mh.today span { color: var(--accent-ink); }
.l-mrow { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.l-mrow b { font-weight: 700; }
.l-mcell { min-height: 58px; border-radius: calc(var(--r) * .55); background: var(--bg); border: 1px solid transparent; padding: 6px 7px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; font-size: 12.5px; line-height: 1.3; min-width: 0; }
.l-mcell:hover { border-color: var(--accent); }
.l-mcell.today { background: color-mix(in srgb, var(--accent-soft) 60%, var(--bg)); }
.l-mcell.has { background: var(--card); box-shadow: var(--shadow-sm); border-color: var(--line); }
.l-mt { font-weight: 700; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; word-break: break-word; }
.l-mplus { color: var(--faint); font-size: 18px; margin: auto; opacity: 0; transition: opacity .15s; }
.l-mcell:hover .l-mplus, .l-mcell:focus-visible .l-mplus { opacity: 1; }
.l-ming { font-size: 11px; color: var(--faint); font-weight: 700; }
.l-mlist { display: none; gap: 6px; }
.l-mday { display: grid; grid-template-columns: 54px 1fr; gap: 8px; align-items: start; padding: 6px; border-radius: calc(var(--r) * .6); background: var(--bg); }
.l-mday.today { background: color-mix(in srgb, var(--accent-soft) 60%, var(--bg)); }
.l-mdh { display: grid; font-size: 12px; color: var(--faint); padding-top: 3px; }
.l-mdh b { font-family: var(--font-display); font-size: 14px; color: var(--fg); }
.l-mday.today .l-mdh b { color: var(--accent-ink); }
.l-mdmeals { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.l-mchip { display: inline-flex; gap: 4px; align-items: center; max-width: 100%; padding: 3px 9px 3px 6px; border-radius: 99px; font-size: 12.5px; color: var(--faint); border: 1px dashed var(--line); }
.l-mchip.has { color: var(--fg); background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-sm); font-weight: 700; }
.l-mchip:hover { border-color: var(--accent); }
.l-mct { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
@container (max-width: 520px) { .l-meals-wrap { display: none; } .l-mlist { display: grid; } }
.l-ing-ro { white-space: pre-wrap; font: inherit; font-size: 13px; color: var(--muted); margin: 6px 0 0; }
/* goals */
.l-goals { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.l-goal { position: relative; border-radius: calc(var(--r) * .9); padding: 12px; background: color-mix(in srgb, var(--gc) 32%, var(--card)); border: 1px solid color-mix(in srgb, var(--gc) 70%, var(--line)); display: grid; gap: 9px; min-width: 0; overflow: visible; }
.l-goal.done { background: color-mix(in srgb, var(--gc) 55%, var(--card)); }
.l-ghead { display: flex; align-items: flex-start; gap: 8px; }
.l-ghead .hico { font-size: 22px; width: 34px; height: 34px; background: var(--card); box-shadow: var(--shadow-sm); }
.l-gtitle { font-family: var(--font-display); font-weight: 650; font-size: 16px; display: block; padding: 0 2px; }
.l-gmeta { margin-top: 1px; }
.l-gpct { font-family: var(--font-display); font-size: 18px; font-variant-numeric: tabular-nums; }
.l-bar { height: 10px; border-radius: 99px; background: color-mix(in srgb, var(--card) 75%, transparent); overflow: hidden; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 6%, transparent); }
.l-bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, color-mix(in srgb, var(--gc) 100%, #000 18%), color-mix(in srgb, var(--accent-strong) 70%, var(--gc))); transition: width .5s cubic-bezier(.3,1.4,.5,1); }
.l-gctl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.l-gctl .nav-btn { background: var(--card); box-shadow: var(--shadow-sm); font-weight: 800; }
.l-gval { max-width: 84px; flex: 0 1 84px; text-align: center; background: var(--card); padding: 5px 6px; }
.l-steps { display: grid; gap: 4px; }
.l-step { display: flex; align-items: flex-start; gap: 4px; font-size: 14px; }
.l-step .chk { width: 17px; height: 17px; margin-top: 2px; border-radius: 5px; }
.l-burst { position: absolute; top: 40%; font-size: 18px; pointer-events: none; animation: lBurst 1.2s ease-out forwards; z-index: 3; }
@keyframes lBurst { 0% { transform: translate(0, 0) scale(.5); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.1); opacity: 0; } }
/* countdowns */
.l-cds { display: grid; gap: 8px; }
.l-cd { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: calc(var(--r) * .8); background: color-mix(in srgb, var(--gc) 28%, var(--card)); border: 1px solid color-mix(in srgb, var(--gc) 60%, var(--line)); }
.l-cd.past { opacity: .55; filter: saturate(.4); }
.l-cd.today { box-shadow: 0 0 0 2px var(--accent-strong); }
.l-cdico { font-size: 22px; width: 36px; height: 36px; background: var(--card); box-shadow: var(--shadow-sm); flex: none; }
.l-cd .ied { font-weight: 700; display: inline-block; }
.l-cdchip { flex: none; min-width: 64px; text-align: center; background: var(--card); border-radius: calc(var(--r) * .6); padding: 4px 8px; box-shadow: var(--shadow-sm); display: grid; line-height: 1.1; }
.l-cdchip b { font-family: var(--font-display); font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.l-cd.today .l-cdchip b { font-size: 14px; }
.l-cdchip small { font-size: 11px; color: var(--faint); font-weight: 700; }
/* wellness */
.l-well { display: grid; gap: 14px; }
.l-wsec { display: grid; gap: 8px; }
.l-wh { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.l-wh b { font-family: var(--font-display); font-weight: 650; }
.l-cups { display: flex; flex-wrap: wrap; gap: 6px; }
.l-cup { width: 30px; height: 38px; border-radius: 4px 4px 10px 10px; border: 2px solid hsl(205 70% 72%); background: hsl(205 90% 97%); position: relative; overflow: hidden; transition: transform .15s; }
.l-cup:hover:not(:disabled) { transform: translateY(-2px); }
.l-cupfill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(180deg, hsl(200 90% 78%), hsl(205 85% 66%)); transition: height .35s cubic-bezier(.3,1.4,.5,1); }
.l-cup.on .l-cupfill { height: 82%; }
.l-cup.extra { border-style: dashed; }
.l-cup.add { border-style: dashed; color: hsl(205 60% 55%); font-weight: 800; background: transparent; }
.l-sleep { max-width: 90px; flex: 0 1 90px; text-align: center; }
.l-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.l-chart { background: var(--bg); border-radius: calc(var(--r) * .7); padding: 8px 10px; }
.l-ch { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.l-bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; height: 84px; }
.l-bcol { display: grid; grid-template-rows: 1fr auto; gap: 3px; text-align: center; font-size: 10.5px; color: var(--faint); font-weight: 700; min-width: 0; }
.l-bcol.cur span { color: var(--accent-ink); }
.l-btrack { position: relative; border-radius: 6px; background: color-mix(in srgb, var(--line) 50%, transparent); overflow: hidden; }
.l-bfill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 6px 6px 4px 4px; transition: height .4s; }
.water .l-bfill { background: hsl(205 70% 78%); } .water .l-bfill.met { background: hsl(205 80% 62%); }
.sleep .l-bfill { background: hsl(262 55% 82%); } .sleep .l-bfill.met { background: hsl(262 55% 66%); }
.l-bgoal { position: absolute; left: 0; right: 0; height: 0; border-top: 1.5px dashed color-mix(in srgb, var(--fg) 30%, transparent); }
/* journal */
.l-prompt { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: calc(var(--r) * .8); background: var(--accent-soft); color: var(--accent-ink); font-size: 15px; margin-bottom: 10px; }
.l-prompt i { font-family: var(--font-display); font-style: normal; font-weight: 600; }
.l-jbody { display: grid; grid-template-columns: minmax(0, 1fr) minmax(180px, 240px); gap: 12px; align-items: start; }
@container (max-width: 520px) { .l-jbody { grid-template-columns: 1fr; } }
.l-jmain { display: grid; gap: 8px; min-width: 0; }
.l-jmoods { display: flex; flex-wrap: wrap; gap: 3px; }
.l-jmood { width: 32px; height: 32px; border-radius: 10px; font-size: 18px; filter: grayscale(.7); opacity: .65; transition: transform .15s, filter .15s; }
.l-jmood:hover:not(:disabled), .l-jmood.on { filter: none; opacity: 1; transform: scale(1.12); }
.l-jmood.on { background: var(--accent-soft); }
.l-jtext { min-height: 130px; font-size: 15px; background: var(--card); }
.l-grat { display: grid; gap: 6px; background: var(--bg); padding: 10px; border-radius: calc(var(--r) * .7); }
.l-grat b { font-family: var(--font-display); font-weight: 650; font-size: 14px; }
.l-grat .field { background: var(--card); padding: 6px 9px; font-size: 13.5px; }
.l-jpast { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
.l-jchip { font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--bg); color: var(--muted); }
.l-jchip:hover { background: var(--accent-soft); color: var(--accent-ink); }

/* ---------- Media blocks: bookmark, image, file, embed ---------- */
.fl-empty { display: grid; gap: 8px; padding: 14px; margin: 6px 0; border: 1.5px dashed var(--line); border-radius: calc(var(--r) * .8); background: color-mix(in srgb, var(--card) 70%, transparent); color: var(--muted); font-size: 13.5px; }
.fl-drop.over { border-color: var(--accent-strong); background: var(--accent-soft); }
.fl-hint { font-weight: 800; color: var(--fg); font-size: 14px; }
.fl-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.fl-row > .field { flex: 1; min-width: 160px; }
.fl-row label.btn { cursor: pointer; }
.fl-status { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-weight: 700; }
.fl-status.err { color: var(--danger); }
.fl-tools { display: flex; gap: 6px; align-items: center; justify-content: flex-end; margin-top: 4px; flex-wrap: wrap; }
.fl-tools .mini-x { opacity: .7; }
.fl-seg button { padding: 3px 10px; font-size: 12px; }
/* bookmark */
.fl-bookmark { margin: 6px 0; }
.fl-card { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: calc(var(--r) * .8); overflow: hidden; background: var(--card); color: var(--fg); text-decoration: none; box-shadow: var(--shadow-sm); transition: border-color .15s, transform .15s; min-height: 92px; }
.fl-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.fl-card-txt { flex: 1; min-width: 0; padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.fl-card-t { font-weight: 800; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fl-card-d { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fl-card-u { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--faint); min-width: 0; }
.fl-card-u span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fl-fav { width: 16px; height: 16px; border-radius: 4px; flex: none; font-size: 12px; line-height: 16px; object-fit: contain; }
.fl-card-img { flex: 0 0 min(34%, 220px); background: var(--hover); }
.fl-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
@container (max-width: 380px) { .fl-card-img { display: none; } }
/* image */
.fl-fig { margin: 8px 0; display: grid; gap: 4px; }
.fl-fig.w-s { width: min(100%, 320px); } .fl-fig.w-m { width: min(100%, 560px); } .fl-fig.w-f { width: 100%; }
.fl-imgwrap { border-radius: calc(var(--r) * .8); overflow: hidden; cursor: zoom-in; background: var(--hover); min-height: 60px; line-height: 0; }
.fl-imgwrap.loading { min-height: 160px; animation: flPulse 1.2s ease-in-out infinite; }
@keyframes flPulse { 50% { opacity: .55; } }
.fl-img { width: auto; max-width: 100%; height: auto; display: block; margin: 0 auto; }
.fl-cap { font-size: 13px; color: var(--muted); text-align: center; outline: none; min-height: 1.4em; padding: 0 4px; border-radius: 6px; }
.fl-cap:empty::before { content: attr(data-ph); color: var(--faint); }
.fl-cap:focus { background: var(--hover); }
.fl-bigwrap { display: grid; place-items: center; }
.fl-big { max-width: 100%; max-height: 75vh; border-radius: calc(var(--r) * .6); }
/* file */
.fl-file { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin: 6px 0; border: 1px solid var(--line); border-radius: calc(var(--r) * .8); background: var(--card); box-shadow: var(--shadow-sm); }
.fl-ficon { font-size: 26px; flex: none; }
.fl-fname { flex: 1; min-width: 0; display: grid; text-align: left; gap: 1px; }
.fl-fname b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fl-fname small { color: var(--faint); font-size: 12px; }
.fl-fname:hover b { color: var(--accent-ink); text-decoration: underline; }
/* embed */
.emb { margin: 8px 0; }
.emb-box { border-radius: calc(var(--r) * .8); overflow: hidden; border: 1px solid var(--line); background: var(--hover); line-height: 0; }
.emb-frame { width: 100%; border: 0; display: block; resize: vertical; }
.emb-spotify { border: 0; background: transparent; }
.emb .fl-tools a.pill-btn { text-decoration: none; }
/* password vault */
.w-vault .vault-note { display: grid; gap: 4px; padding: 12px 14px; border-radius: calc(var(--r) * .7); background: var(--bg); font-size: 13.5px; color: var(--muted); }
.w-vault .vault-note b { color: var(--fg); }
.vault-lock { display: grid; justify-items: center; gap: 6px; text-align: center; padding: 18px 10px; }
